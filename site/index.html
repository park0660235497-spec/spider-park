<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สื่อการสอนของปาร์ค</title>
<meta name="color-scheme" content="light">
<script>
  // ลิงก์ Web app ของ Apps Script (ตัวเดียวกับในหน้า edit.html) ถ้ายังไม่มี เว็บจะอ่านจากชีตโดยตรงแทน
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-Ev7uPnCj0dDag_eyeembdpKhrlw98AihU62y2MAmVfYJGbFKsroNwIOz08s0gd9K/exec";
  const RESOURCES_SHEET_ID = "1LisxRnsMpNlki85XmsxdFXJ8z60Leuj1cymHvG1a-LM";
  const SITE_SHEET_ID = "1THGBjAFssJp98QeJvA8Wii8kRJqwkpkOxAW8y8cUF1c";
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Anuphan:wght@400;500;600&display=swap">
<style>
/* โทนพาสเทลมินิมอล: พื้นลาเวนเดอร์อ่อน การ์ดขาว สีประจำหน่วยวนตามลำดับ */
:root{
  --bg:#F7F6FC; --card:#FFFFFF; --ink:#2B2A3D; --sub:#6A6886; --mute:#8A87A3; --line:#EFEDF7; --field:#E7E4F3;
  --peach:#FFD8C9; --mint:#CDEFE0; --sky:#D6E6FF; --lilac:#E6DDFB; --butter:#FFF1B8; --rose:#FBD9E6;
  --slide-bg:#E8F0FF; --slide:#3F64A8; --lab-bg:#E3F6EC; --lab:#2D7A57; --sheet-bg:#FFEFD9; --sheet:#9A5B12; --video-bg:#FBD9E6; --video:#A8406A;
  --easy-bg:#DDF4E8; --easy:#2D7A57; --mid-bg:#FFF1C2; --mid:#8A6A12; --hard-bg:#FFE0DC; --hard:#A8483C; --key-bg:#ECE6FD; --key:#5B4FC4;
  --display:'Mitr','Anuphan',system-ui,sans-serif; --body:'Anuphan',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.6}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #9B8CF0;outline-offset:2px;border-radius:12px}
.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 64px;display:flex;flex-direction:column;gap:24px}

/* hero */
.hero{position:relative;border-radius:28px;overflow:hidden;min-height:240px;display:flex;align-items:flex-end;padding:24px;
  background:linear-gradient(120deg,#FFE3D6 0%,#E6DDFB 55%,#D6E6FF 100%)}
.hero .cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-card{position:relative;display:flex;gap:18px;align-items:center;background:rgba(255,255,255,.9);border-radius:22px;padding:16px 22px 16px 16px;max-width:100%;backdrop-filter:blur(6px)}
.avatar{width:80px;height:80px;border-radius:50%;object-fit:cover;flex:none;background:var(--peach);display:grid;place-items:center;font-family:var(--display);font-size:30px;color:#9A5B45}
.hero h1{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(26px,4.5vw,40px);line-height:1.15;text-wrap:balance}
.hero p{margin:4px 0 0;color:var(--sub)}
.hero-text{min-width:0}

/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tab{border:none;cursor:pointer;border-radius:999px;padding:10px 20px;font-family:var(--display);font-size:15.5px;background:var(--c,var(--lilac));transition:transform .12s}
.tab:hover{transform:translateY(-1px)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.search{flex:1 1 240px;min-width:0;display:flex}
.search input{width:100%;font:inherit;border:1.5px solid var(--field);background:#fff;border-radius:999px;padding:11px 20px;color:var(--ink)}
.desc{margin:-10px 0 0;color:var(--sub)}

/* units */
.units{display:flex;flex-direction:column;gap:14px}
.unit{background:var(--card);border-radius:26px;overflow:hidden}
.unit-head{width:100%;display:flex;align-items:center;gap:14px;padding:18px 22px;background:none;border:none;cursor:pointer;text-align:left}
.num{width:44px;height:44px;border-radius:14px;background:var(--uc);display:grid;place-items:center;font-family:var(--display);font-size:18px;flex:none}
.unit-head h2{margin:0;font-family:var(--display);font-weight:500;font-size:clamp(18px,2.6vw,23px);flex:1;min-width:0}
.count{font-size:13.5px;color:var(--mute);white-space:nowrap}
.plus{width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--mute);font-size:20px;line-height:1;flex:none;transition:transform .2s}
.unit.open .plus{transform:rotate(45deg)}
.unit-body{display:none;padding:0 22px 22px;flex-direction:column;gap:18px}
.unit.open .unit-body{display:flex}
.chapter{display:flex;flex-direction:column;gap:12px;border-top:1.5px dashed var(--line);padding-top:16px}
.chapter h3{margin:0;font-size:16.5px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{display:flex;flex-direction:column;text-decoration:none;background:#fff;border:1.5px solid var(--line);border-radius:20px;overflow:hidden;transition:transform .15s,box-shadow .15s;min-width:0}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(91,79,196,.12)}
.thumb{aspect-ratio:16/10;max-width:100%;position:relative;overflow:hidden;background:var(--tb)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb svg{position:absolute;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%);stroke:var(--tc);opacity:.8}
.card-body{padding:12px 14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tag{align-self:flex-start;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--tb);color:var(--tc)}
.card-title{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.sheets{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sheets .lbl{font-size:13.5px;color:var(--mute);margin-right:2px}
.pill{text-decoration:none;border-radius:999px;padding:8px 16px;font-weight:500;background:var(--sheet-bg);color:var(--sheet);transition:transform .12s}
.pill:hover{transform:translateY(-1px)}
.pill.easy{background:var(--easy-bg);color:var(--easy)} .pill.mid{background:var(--mid-bg);color:var(--mid)} .pill.hard{background:var(--hard-bg);color:var(--hard)} .pill.key{background:var(--key-bg);color:var(--key)}
.soon{color:var(--mute);font-size:14px}
.msg{background:#fff;border-radius:22px;padding:40px 20px;text-align:center;color:var(--sub)}
/* video */
.play{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 4px 14px rgba(43,42,61,.18);transition:transform .15s}
.play::after{content:"";margin-left:4px;border-left:16px solid var(--video);border-top:10px solid transparent;border-bottom:10px solid transparent}
.card:hover .play{transform:scale(1.08)}
dialog.player{border:none;padding:0;border-radius:24px;width:min(960px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--card);color:var(--ink);overflow:auto}
dialog.player::backdrop{background:rgba(43,42,61,.55)}
.pl-frame{aspect-ratio:16/9;background:#111;width:100%}
.pl-frame iframe{width:100%;height:100%;border:0;display:block}
.pl-bar{display:flex;align-items:center;gap:10px;padding:12px 14px 14px;flex-wrap:wrap}
.pl-title{flex:1 1 220px;min-width:0;font-family:var(--display);font-size:17px;line-height:1.35}
.pl-title small{display:block;font-family:var(--body);font-size:13px;color:var(--mute)}
.pl-btn{border:none;cursor:pointer;border-radius:999px;padding:9px 16px;background:var(--bg);font-family:var(--display);font-size:14.5px;white-space:nowrap}
.pl-btn:disabled{opacity:.4;cursor:default}
.pl-btn.close{background:var(--ink);color:#fff}
mark{background:var(--butter);color:inherit;border-radius:4px;padding:0 2px}
footer{text-align:center;color:var(--mute);font-size:13px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;align-items:center}
footer button{border:1.5px solid var(--field);background:#fff;border-radius:999px;padding:5px 14px;cursor:pointer}
@media (max-width:560px){
  .hero{min-height:200px;padding:14px;border-radius:22px}
  .hero-card{padding:12px;gap:12px}
  .avatar{width:56px;height:56px;font-size:22px}
  .unit-head{padding:16px}
  .unit-body{padding:0 16px 18px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .count{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero" id="hero">
    <div class="hero-card">
      <div class="avatar" id="avatar" aria-hidden="true">ป</div>
      <div class="hero-text">
        <h1 id="title">สื่อการสอนของปาร์ค</h1>
        <p id="subtitle"></p>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="toolbar" role="tablist" aria-label="หมวดหมู่" id="tabs"></div>
    <label class="search"><input id="q" type="search" placeholder="ค้นหาเรื่อง สไลด์ ใบงาน หรือแล็บ…" aria-label="ค้นหา"></label>
  </div>
  <p class="desc" id="desc"></p>

  <main class="units" id="units"><div class="msg">กำลังโหลด…</div></main>

  <footer><span id="foot"></span><button type="button" id="reload">รีเฟรชข้อมูล</button></footer>
</div>

<script>
const UNIT_COLORS = ['--peach','--sky','--mint','--lilac','--butter','--rose'];
const TAB_COLORS = ['--peach','--mint','--sky','--lilac','--butter','--rose'];
const TYPE_STYLE = {slide:['--slide-bg','--slide'], lab:['--lab-bg','--lab'], sheet:['--sheet-bg','--sheet'], video:['--video-bg','--video']};
const ICONS = {
  slide:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></svg>',
  lab:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/><path d="M7.5 15h9"/></svg>',
  video:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>'
};
let DATA = {resources:[], site:{}}, level = null, openUnits = new Set();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- data ---------- */
function loadJSONP(id){ return new Promise((res, rej) => {
  const cb = 'gv' + Math.random().toString(36).slice(2); const s = document.createElement('script');
  const t = setTimeout(() => { done(); rej(new Error('โหลดข้อมูลไม่สำเร็จ ตรวจสอบว่าชีตเปิดสิทธิ์ "ทุกคนที่มีลิงก์ดูได้"')); }, 12000);
  function done(){ clearTimeout(t); delete window[cb]; s.remove(); }
  window[cb] = o => { done(); res(o); };
  s.onerror = () => { done(); rej(new Error('โหลดข้อมูลไม่สำเร็จ')); };
  s.src = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?headers=1&tqx=out:json;responseHandler:${cb}`;
  document.body.appendChild(s); }); }
function gvizRows(r){ if(!r || !r.table) return []; const h = r.table.cols.map(c => (c.label||'').trim());
  return (r.table.rows||[]).map(row => { const o = {}; h.forEach((k,i) => { if(k){ const c = (row.c||[])[i]; o[k] = c && c.v != null ? c.v : ''; } }); return o; })
    .filter(o => Object.values(o).some(v => v !== '')); }
async function fetchData(){
  if(APPS_SCRIPT_URL && !APPS_SCRIPT_URL.startsWith('PASTE')){
    try{ const r = await fetch(APPS_SCRIPT_URL); const d = await r.json(); if(d && d.resources) return d; }catch(_){}
  }
  const [a, b] = await Promise.all([loadJSONP(RESOURCES_SHEET_ID), loadJSONP(SITE_SHEET_ID)]);
  const site = {}; gvizRows(b).forEach(r => { if(r.Key) site[String(r.Key).toLowerCase()] = r.Value; });
  return {resources: gvizRows(a), site};
}

/* ---------- helpers ---------- */
function driveId(u){ const m = String(u||'').match(/\/d\/([\w-]{20,})/) || String(u||'').match(/[?&]id=([\w-]{20,})/); return m ? m[1] : null; }
function ytId(u){ const m = String(u||'').match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/); return m ? m[1] : null; }
function isDrive(u){ return /(drive|docs)\.google\.com/.test(String(u||'')); }
function imgURL(u, w){ if(!u) return ''; const id = isDrive(u) && driveId(u); return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w${w||800}` : String(u).trim(); }
function thumbFor(r){ if(r.ResImageURL) return imgURL(r.ResImageURL); const yt = ytId(r.ResURL); if(yt) return `https://i.ytimg.com/vi/${yt}/mqdefault.jpg`; if(isDrive(r.ResURL) && driveId(r.ResURL)) return imgURL(r.ResURL); return ''; }
const typeLabel = t => (DATA.site['label_' + t] || {slide:'สไลด์', lab:'แล็บ / กิจกรรม', sheet:'ใบงาน', video:'วิดีโอ'}[t] || 'ลิงก์');
const diff = l => /เฉลย/.test(l) ? 'key' : /ง่าย/.test(l) ? 'easy' : /กลาง/.test(l) ? 'mid' : /ยาก/.test(l) ? 'hard' : '';
const diffRank = l => ({easy:1, mid:2, hard:3, key:4})[diff(l)] || 0;
function hl(text, q){ const t = String(text||''); if(!q) return esc(t); const i = t.toLowerCase().indexOf(q); return i < 0 ? esc(t) : esc(t.slice(0,i)) + '<mark>' + esc(t.slice(i, i+q.length)) + '</mark>' + esc(t.slice(i+q.length)); }

function group(){
  const L = [], map = {};
  DATA.resources.forEach(r => {
    if(!r.LevelID) return;
    let lv = map[r.LevelID]; if(!lv){ lv = map[r.LevelID] = {id:r.LevelID, short:r.LevelShort || r.LevelID, desc:r.LevelDesc || '', units:{}}; L.push(lv); }
    if(!lv.desc && r.LevelDesc) lv.desc = r.LevelDesc;
    const uk = String(r.UnitOrder); let u = lv.units[uk]; if(!u) u = lv.units[uk] = {order:+r.UnitOrder||0, name:r.UnitName||'', ch:{}};
    const ck = String(r.ChapterOrder); let c = u.ch[ck]; if(!c) c = u.ch[ck] = {order:+r.ChapterOrder||0, name:r.ChapterName||'', res:[]};
    if(r.ResType && String(r.ResURL||'').trim()) c.res.push(r);
  });
  L.forEach(lv => { lv.units = Object.values(lv.units).sort((a,b) => a.order - b.order); lv.units.forEach(u => u.ch = Object.values(u.ch).sort((a,b) => a.order - b.order)); });
  return L;
}

/* ---------- render ---------- */
function renderHero(){
  const s = DATA.site;
  $('#title').textContent = s.title || 'สื่อการสอนของปาร์ค'; document.title = s.title || 'สื่อการสอนของปาร์ค';
  $('#subtitle').textContent = s.subtitle || '';
  const old = $('#hero .cover'); if(old) old.remove();
  if(s.coverimage){ const im = new Image(); im.className = 'cover'; im.alt = ''; im.referrerPolicy = 'no-referrer'; im.onerror = () => im.remove(); im.src = imgURL(s.coverimage, 1800); $('#hero').prepend(im); }
  const av = $('#avatar');
  if(s.headerimage){ const src = imgURL(s.headerimage, 300);
    if(av.tagName !== 'IMG'){ const im = new Image(); im.className = 'avatar'; im.id = 'avatar'; im.alt = ''; im.referrerPolicy = 'no-referrer'; im.onerror = () => {}; im.src = src; av.replaceWith(im); } else av.src = src; }
}
function renderTabs(L){
  if(!L.some(l => l.id === level)) level = L[0] && L[0].id;
  $('#tabs').innerHTML = L.map((l,i) => `<button class="tab" role="tab" type="button" aria-selected="${l.id===level}" data-l="${esc(l.id)}" style="--c:var(${TAB_COLORS[i % TAB_COLORS.length]})">${esc(l.short)}</button>`).join('');
}
function resCard(r, q){
  const [bg, fg] = TYPE_STYLE[r.ResType] || ['--lilac','--key']; const th = thumbFor(r);
  const icon = ICONS[r.ResType] || ICONS.link;
  const vid = r.ResType === 'video' && ytId(r.ResURL);
  return `<a class="card" href="${esc(r.ResURL)}" target="_blank" rel="noopener" style="--tb:var(${bg});--tc:var(${fg})"${vid ? ` data-v="${esc(vid)}"` : ''}>
    <div class="thumb">${icon}${th ? `<img src="${esc(th)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}${vid ? '<span class="play" aria-hidden="true"></span>' : ''}</div>
    <div class="card-body"><span class="tag">${esc(typeLabel(r.ResType))}</span><span class="card-title">${hl(r.ResLabel || typeLabel(r.ResType), q)}</span></div></a>`;
}
function render(){
  const L = group(); renderTabs(L);
  const lv = L.find(l => l.id === level);
  if(!lv){ $('#desc').textContent = ''; $('#units').innerHTML = '<div class="msg">ยังไม่มีข้อมูลบนเว็บไซต์นี้</div>'; return; }
  $('#desc').textContent = lv.desc;
  const q = $('#q').value.trim().toLowerCase();
  const units = lv.units.map((u, ui) => {
    const chs = u.ch.map(c => ({...c, res: q ? c.res.filter(r => [r.ResLabel, c.name, u.name].some(x => String(x).toLowerCase().includes(q))) : c.res}))
      .filter(c => !q || c.res.length || c.name.toLowerCase().includes(q));
    return {...u, ui, ch: chs};
  }).filter(u => !q || u.ch.length || u.name.toLowerCase().includes(q));
  if(!units.length){ $('#units').innerHTML = `<div class="msg">ไม่พบ "${esc(q)}" ลองคำอื่น หรือเลือกหมวดอื่น</div>`; return; }
  if(!openUnits.size && units[0]) openUnits.add(level + '|' + units[0].order);
  $('#units').innerHTML = units.map(u => {
    const key = level + '|' + u.order, open = q || openUnits.has(key);
    const total = u.ch.reduce((s,c) => s + c.res.length, 0);
    return `<section class="unit ${open ? 'open' : ''}" style="--uc:var(${UNIT_COLORS[u.ui % UNIT_COLORS.length]})">
      <button class="unit-head" type="button" data-u="${esc(key)}" aria-expanded="${!!open}"><span class="num">${u.ui + 1}</span><h2>${hl(String(u.name).replace(/:\s*$/,''), q)}</h2><span class="count">${u.ch.length} เรื่อง · ${total} ชิ้น</span><span class="plus" aria-hidden="true">+</span></button>
      <div class="unit-body">${u.ch.map(c => {
        const main = c.res.filter(r => r.ResType !== 'sheet');
        const sheets = c.res.filter(r => r.ResType === 'sheet').sort((a,b) => diffRank(a.ResLabel) - diffRank(b.ResLabel));
        return `<div class="chapter"><h3>${hl(c.name, q)}</h3>
          ${main.length ? `<div class="grid">${main.map(r => resCard(r, q)).join('')}</div>` : ''}
          ${sheets.length ? `<div class="sheets"><span class="lbl">${esc(typeLabel('sheet'))}</span>${sheets.map(r => `<a class="pill ${diff(r.ResLabel)}" href="${esc(r.ResURL)}" target="_blank" rel="noopener">${hl(r.ResLabel || typeLabel('sheet'), q)}</a>`).join('')}</div>` : ''}
          ${!c.res.length ? '<span class="soon">กำลังเตรียมสื่อ เร็ว ๆ นี้</span>' : ''}</div>`; }).join('')}</div></section>`;
  }).join('');
}

/* ---------- video player ---------- */
let PL = [], PI = 0;
const dlg = document.createElement('dialog'); dlg.className = 'player'; dlg.setAttribute('aria-label', 'เล่นวิดีโอ');
dlg.innerHTML = '<div class="pl-frame" id="plFrame"></div><div class="pl-bar"><div class="pl-title" id="plTitle"></div><button class="pl-btn" type="button" id="plPrev">‹ ก่อนหน้า</button><button class="pl-btn" type="button" id="plNext">ถัดไป ›</button><button class="pl-btn close" type="button" id="plClose">ปิด</button></div>';
document.body.appendChild(dlg);
function playAt(i){
  PI = i; const c = PL[i];
  $('#plFrame').innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${c.v}?autoplay=1&rel=0&playsinline=1" title="${esc(c.t)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  $('#plTitle').innerHTML = `${esc(c.t)}<small>${i + 1} / ${PL.length}${c.ch ? ' · ' + esc(c.ch) : ''}</small>`;
  $('#plPrev').disabled = i === 0; $('#plNext').disabled = i === PL.length - 1;
}
function openPlayer(card){
  const cards = [...card.closest('.unit-body, .units').querySelectorAll('.card[data-v]')];
  PL = cards.map(c => ({v:c.dataset.v, t:c.querySelector('.card-title').textContent, ch:(c.closest('.chapter')?.querySelector('h3')?.textContent || '')}));
  playAt(Math.max(0, cards.indexOf(card)));
  if(!dlg.open) dlg.showModal();
}
$('#plPrev').addEventListener('click', () => PI > 0 && playAt(PI - 1));
$('#plNext').addEventListener('click', () => PI < PL.length - 1 && playAt(PI + 1));
$('#plClose').addEventListener('click', () => dlg.close());
dlg.addEventListener('click', e => { if(e.target === dlg) dlg.close(); });
dlg.addEventListener('close', () => { $('#plFrame').innerHTML = ''; });

/* ---------- events ---------- */
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-l]'); if(!b) return; level = b.dataset.l; openUnits.clear(); try{ localStorage.setItem('park-level', level); }catch(_){} render(); });
$('#units').addEventListener('click', e => { const v = e.target.closest('.card[data-v]'); if(v && !e.ctrlKey && !e.metaKey && !e.shiftKey){ e.preventDefault(); openPlayer(v); return; } const b = e.target.closest('[data-u]'); if(!b) return; const k = b.dataset.u; openUnits.has(k) ? openUnits.delete(k) : openUnits.add(k); b.closest('.unit').classList.toggle('open'); b.setAttribute('aria-expanded', b.closest('.unit').classList.contains('open')); });
$('#q').addEventListener('input', render);
$('#reload').addEventListener('click', () => boot());
async function boot(){
  $('#foot').textContent = 'กำลังโหลด…';
  try{
    DATA = await fetchData();
    try{ const s = localStorage.getItem('park-level'); if(s && !level) level = s; }catch(_){}
    renderHero(); render();
    $('#foot').textContent = (DATA.site.title || 'สื่อการสอนของปาร์ค') + ' · อัปเดตจากข้อมูลล่าสุด';
  }catch(err){ $('#units').innerHTML = `<div class="msg">${esc(err.message)}</div>`; $('#foot').textContent = ''; }
}
boot();
</script>
</body>
</html>
