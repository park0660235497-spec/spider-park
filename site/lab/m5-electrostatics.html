<title>ParK_iLab ไฟฟ้าสถิต</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Anuphan:wght@400;500;600&display=swap">
<style>
/* Layout: step rail on the left (top bar on phones) + one working view; the lab view is a 3D bench beside a control panel.
   Single bright pastel look by choice, so every color is set explicitly. */
:root{
  color-scheme: light;
  --bg:#F6F7FB; --surface:#FFFFFF; --soft:#F1F4FD; --stage:#EDF1FA;
  --ink:#1E2340; --ink2:#3D4466; --muted:#5B6280; --line:#E6E9F2; --line2:#E1E5F0;
  --primary:#3B6FD8; --primary-d:#2A54AE; --primary-soft:#EAF0FE;
  --atom:#FFC94D; --atom-soft:#FFF4D6; --mint:#5CCFA4; --ok:#1F8A63; --ok-soft:#DDF5EA;
  --pink:#FF8FB1; --red:#E25555; --red-soft:#FDE8E8; --lock:#7A809A; --lock-bg:#EEF0F6;
  --f-display:'Mitr', 'Noto Sans Thai', sans-serif;
  --f-body:'Anuphan', 'Noto Sans Thai', 'Leelawadee UI', sans-serif;
  --r-lg:24px; --r-md:16px; --r-sm:12px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;line-height:1.3}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

.app{display:flex;min-height:100%}
.rail{flex:0 0 268px;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;border:0;background:none;cursor:pointer;text-align:left}
.brand b{font-family:var(--f-display);font-size:21px;font-weight:600}
.brand b span{color:var(--primary)}
.credit{font-size:12.5px;font-weight:600;color:var(--primary-d);letter-spacing:.2px}
.steps{display:flex;flex-direction:column;gap:4px}
.steps-label{font-size:13px;color:var(--muted);padding:0 12px 6px}
.step{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 12px;border:0;border-radius:14px;background:transparent;text-align:left;cursor:pointer}
.step:hover:not(:disabled){background:var(--soft)}
.step:disabled{cursor:not-allowed;color:var(--lock)}
.step.current{background:var(--primary-soft)}
.step .dot{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--lock-bg);color:var(--lock);font-weight:600;font-size:14px}
.step.current .dot{background:var(--primary);color:#fff}
.step.done .dot{background:var(--ok-soft);color:var(--ok)}
.step .lbl{flex:1;font-size:15px;font-weight:500}
.progress{margin-top:auto;padding:16px;border-radius:var(--r-md);background:var(--soft);display:flex;flex-direction:column;gap:8px}
.bar{height:10px;border-radius:99px;background:#DDE3F3;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .4s ease}
.linkbtn{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer;padding:4px 0;text-align:left}

main{flex:1;min-width:0;padding:28px 36px 48px}
.wrap{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.wrap.wide{max-width:1320px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{padding:4px 12px;border-radius:99px;font-size:13px;font-weight:600}
.tag.y{background:var(--atom-soft);color:#7A5A00}.tag.g{background:var(--ok-soft);color:#1D6B4F}.tag.b{background:var(--primary-soft);color:var(--primary-d)}
.h1{font-size:clamp(28px,4vw,40px);font-weight:600}
.sub{color:var(--muted);margin:0;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.pad{padding:24px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border:0;border-radius:var(--r-md);background:var(--primary);color:#fff;font-family:var(--f-display);font-size:17px;font-weight:500;box-shadow:0 4px 0 var(--primary-d);cursor:pointer;transition:transform .12s ease}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:0 2px 0 var(--primary-d)}
.btn:disabled{background:#AEB9D6;box-shadow:none;cursor:not-allowed}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 #166B4C}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line2);box-shadow:none;font-family:var(--f-body);font-size:16px}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{min-height:44px;padding:0 16px;font-size:15px}
.ibtn{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--surface);cursor:pointer}
.ibtn:hover{background:var(--soft)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.spread{justify-content:space-between}

.mascot-row{display:flex;flex-wrap:wrap;align-items:center;gap:20px}
.mascot-row .say{flex:1 1 280px;display:flex;flex-direction:column;gap:4px}
.say b{font-family:var(--f-display);font-weight:500;font-size:20px}
.say span{color:var(--ink2)}

.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.part{display:flex;flex-direction:column;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);overflow:hidden;text-align:left;padding:0;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.part:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 14px 30px rgba(30,35,64,.10)}
.part:disabled{cursor:not-allowed}
.part .art{height:140px;display:grid;place-items:center}
.part .body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
.part .k{font-size:13px;font-weight:600;color:var(--muted)}
.part h3{font-size:19px}
.part p{margin:0;font-size:15px;color:var(--muted);flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;background:var(--lock-bg);color:var(--muted);align-self:flex-start;margin-top:6px}
.pill.go{background:var(--primary-soft);color:var(--primary-d)}
.pill.done{background:var(--ok-soft);color:var(--ok)}

/* quiz */
.qhead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.qdots{display:flex;gap:6px;flex-wrap:wrap}
.scen{display:flex;flex-direction:column;gap:8px;background:#F4F8FF}.scen h2{font-size:19px;margin:0}.scen p{margin:0;font-size:15.5px;line-height:1.65;color:var(--ink2)}
.scn{font-size:12.5px;font-weight:700;color:var(--primary-d);letter-spacing:.02em}
.stab{border-collapse:collapse;font-size:14px;margin-top:4px;background:#fff}.stab th,.stab td{border:1px solid var(--line2);padding:6px 10px;text-align:center}.stab th{background:#EAF1FD}
.yn{width:100%;border-collapse:collapse;font-size:15px}.yn th,.yn td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle}.yn th:not(:first-child),.yn td:not(:first-child){width:84px;text-align:center}
.ynb{min-width:70px;min-height:44px;border-radius:12px;border:2px solid var(--line2);background:#FAFBFE;font:inherit;font-size:14px;font-weight:600;cursor:pointer}.ynb.on{background:var(--primary);border-color:var(--primary);color:#fff}
.qopen{width:100%;box-sizing:border-box;border:2px solid var(--line2);border-radius:14px;padding:12px;font:inherit;font-size:16px;line-height:1.6;resize:vertical}
.qsep{display:inline-block;width:8px}
.confrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:14px;background:#FFF8E6}.confrow>span{font-weight:600;font-size:15px}.confrow .seg{min-width:220px}
.pstats{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.pstat{font-size:12.5px;padding:3px 9px;border-radius:99px;background:var(--lock-bg);color:var(--muted);font-weight:600}.pstat.ok{background:var(--ok-soft);color:var(--ok)}
.tqr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}.tq{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:1px solid var(--line);border-radius:14px;padding:10px}.tq span{font-size:13px;color:var(--muted)}.tq input{width:100%;font-size:11px;padding:4px;border:1px solid var(--line2);border-radius:8px}.qrbox{width:120px;height:120px}
.regl{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14.5px;flex:1}.regl input,.regl select{font:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--line2);border-radius:12px;background:#fff;min-width:0}
.regrow{display:flex;gap:10px}.regsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.regsum div{background:#F4F8FF;border-radius:12px;padding:8px 10px}.regsum span{display:block;font-size:12px;color:var(--muted)}.regsum b{font-size:15px}
.sendbox{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#FFF8E6}.sendbox.ok{background:var(--ok-soft)}
.qdot{width:28px;height:28px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;padding:0}
.qdot.ans{background:#CFE0FB;border-color:#CFE0FB;color:var(--primary-d)}
.qdot.cur{outline:2px solid var(--primary);outline-offset:1px}
.qtext{font-size:clamp(20px,2.6vw,25px);line-height:1.5}
.qfig{display:flex;justify-content:center;background:var(--soft);border-radius:var(--r-md);padding:12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:72px;padding:16px 14px 16px 54px;border-radius:20px;border:3px solid var(--line);background:#FAFBFE;cursor:pointer;text-align:left;transition:transform .12s ease}
.opt.pic{padding:46px 12px 14px;text-align:center}
.opt:hover{transform:translateY(-2px)}
.opt .badge{position:absolute;top:12px;left:12px;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;font-family:var(--f-display);background:var(--surface);border:1px solid var(--line2);color:var(--ink2)}
.opt[aria-checked="true"]{border-color:var(--primary);background:var(--primary-soft)}
.opt[aria-checked="true"] .badge{background:var(--primary);border-color:var(--primary);color:#fff}
.opt .t{font-size:16px;font-weight:500;width:100%}

/* lab */
.labgrid{display:flex;flex-wrap:wrap;gap:16px;align-items:stretch}
.stage{flex:999 1 560px;min-width:0;position:relative;height:clamp(360px,64vh,660px);border-radius:var(--r-lg);background:var(--stage);border:1px solid var(--line2);overflow:hidden;touch-action:none}
.stage canvas{display:block;width:100%!important;height:100%!important;cursor:grab}
.stage canvas.dragging{cursor:grabbing}
.stage .hint{position:absolute;top:14px;left:14px;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.92);font-size:13px;font-weight:500;color:var(--ink2);pointer-events:none;max-width:calc(100% - 90px)}
@media (max-width:600px){.stage .hint{font-size:11px;padding:5px 10px;top:8px;left:8px;line-height:1.35;max-width:calc(100% - 70px)}}
.camctl{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:8px;z-index:3}
.labels{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.labels div{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:3px 10px;border-radius:99px;background:rgba(30,35,64,.78);color:#fff;font-size:12px;font-weight:600;white-space:nowrap}
.warn{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:4;padding:8px 16px;border-radius:99px;background:var(--red);color:#fff;font-weight:600;font-size:14px;max-width:calc(100% - 100px);text-align:center;pointer-events:none}
.bubble{position:absolute;left:12px;bottom:12px;right:12px;display:flex;align-items:flex-end;gap:8px;z-index:3;pointer-events:none}
.bubble .msg{max-width:380px;padding:10px 14px;border-radius:18px 18px 18px 4px;background:var(--surface);box-shadow:0 6px 18px rgba(30,35,64,.10);font-size:15px;line-height:1.5}
.labgrid .pdwrap{flex:999 1 480px;min-width:0;display:flex;flex-direction:column}
.pdwrap .stage{flex:none;width:100%;border-radius:var(--r-lg) var(--r-lg) 0 0;border-bottom:0;height:clamp(340px,58vh,640px)}
.pdbar{background:var(--surface);border:1px solid var(--line2);border-top:2px solid var(--line2);border-radius:0 0 var(--r-lg) var(--r-lg);padding:8px 10px}
.pdbar .pdock{padding:0;border:0;background:none;border-radius:0;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:6px 8px}
.pdbar .pdock:empty{display:none}
.pdbar .pdock h2{font-size:13px;font-weight:600;color:var(--primary-d);margin:0 2px 0 4px;flex:none}
.pdbar .pdock .ctl{min-height:48px;gap:8px;background:#F3F5FB;border-radius:12px;padding:3px 4px 3px 12px;flex:none}
.pdbar .pdock .ctl .n{font-size:15px;font-weight:600;color:var(--ink)}
.pdbar .pdock .btn{min-height:48px;font-size:15.5px;padding:0 16px;border-radius:12px}
.pdbar .pdock .ibtn{width:48px;height:48px;font-size:22px}
.pdbar .pdock .seg button{min-height:46px;font-size:15.5px;padding:0 14px}
.pdbar .pdock .row{gap:6px!important;flex:0 1 auto;max-width:100%;flex-wrap:wrap}
.pdbar .pdock .note{font-size:12.5px;flex-basis:100%}
.stage .pres{position:absolute;top:66px;left:12px;z-index:3;width:min(210px,40%);padding:7px 10px;border-radius:14px;background:rgba(255,255,255,.94);box-shadow:0 4px 14px rgba(30,35,64,.12);gap:6px;font-size:12.5px;max-height:calc(100% - 190px);overflow:auto}
.stage .pres:empty{display:none}
.stage .pres.md{top:62px;left:auto;right:66px;width:min(360px,46%);max-height:calc(100% - 140px);font-size:13px;padding:9px 12px}
.stage .pres.md h2{font-size:15px}
.stage .pres.md canvas{max-height:170px;object-fit:contain}
.stage.full .pres.md{width:min(420px,40%);max-height:calc(100% - 90px)}
.stage.full .pres.md canvas{max-height:240px}
.stage .pres.md.c.shut{display:none!important}
.stage .pres.md.c h2::after{content:'✕';font-size:14px}
.reschip{position:absolute;top:10px;right:66px;z-index:5;width:max-content;max-width:42%;display:flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border-radius:12px;background:rgba(255,255,255,.96);box-shadow:0 4px 14px rgba(30,35,64,.12);font-size:14px;min-height:44px;box-sizing:border-box}
.reschip[hidden]{display:none!important}
.stage[data-mdc] .pres.md{top:var(--docky,62px)}
.stage[data-mdc] #dock{right:calc(var(--chipw,0px) + 74px)!important}
.reschip .v{color:#2E6BE6;font-weight:700}
.reschip .btn{min-height:34px;padding:0 10px;flex:0 0 auto}
.reschip b{display:none}
.stage .pres h2{font-size:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}
.stage .pres h2::after{content:'▾';font-size:12px;color:var(--muted)}
.stage .pres.mini h2::after{content:'▸'}
.stage .pres.mini>:not(h2){display:none!important}
.stage .pres .note{font-size:12px}
.stage .pres [style*="font-size:3"],.stage .pres [style*="font-size:4"]{font-size:26px!important}
.stage .pres .stat b,.stage .pres .big{font-size:26px}
#resPop{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);z-index:6;display:none;align-items:center;gap:10px;padding:12px 20px;border-radius:18px;background:rgba(255,255,255,.97);box-shadow:0 10px 30px rgba(30,35,64,.22);font-size:18px;font-weight:600;pointer-events:none;white-space:nowrap}
#resPop.show{display:flex;animation:rp 2.4s ease forwards}
#resPop .status{font-size:20px;padding:4px 14px}
@keyframes rp{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
.pres.pop{animation:presPop .9s ease}
@keyframes pop{0%{transform:scale(1)}25%{transform:scale(1.45);box-shadow:0 0 0 6px rgba(255,196,0,.45)}100%{transform:scale(1)}}
@keyframes presPop{0%{box-shadow:0 0 0 0 rgba(255,196,0,.0)}30%{box-shadow:0 0 0 6px rgba(255,196,0,.6)}100%{box-shadow:0 4px 14px rgba(30,35,64,.12)}}
.pdwrap.full{position:fixed;inset:0;z-index:900;background:var(--surface)}
.pdwrap.full .stage{flex:1 1 auto;height:auto!important;border-radius:0}
.pdwrap.full .pdbar{border-radius:0;border-left:0;border-right:0;border-bottom:0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.stage.full{position:fixed!important;inset:0;width:100vw;height:100vh!important;height:100dvh!important;max-width:none;border-radius:0;z-index:900;border:0}
body.fullon{overflow:hidden}
.ginfo .gsec{box-shadow:none;border:1px solid var(--line);margin-bottom:10px}
.ginfo .gsec h2{font-size:17px}
.eqlock{padding:12px;border-radius:14px;background:var(--lock-bg);color:var(--ink2);font-size:14px}
.eq{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:#F6F8FD;border:1px solid var(--line)}
.eq.ok{background:#EFFAF4;border-color:#BFE6D0}
.eqq{font-weight:600;font-size:15.5px;line-height:1.45}
.eqo{display:flex;flex-direction:column;gap:6px}
.eqb{min-height:48px;text-align:left;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line2);background:var(--surface);font:inherit;font-size:15px;color:var(--ink);cursor:pointer}
.eqb:hover{border-color:var(--primary)}
.eqb.bad{border-color:var(--red);background:#FDECEC;color:#9B2C2C}
.eqok{font-weight:600;color:#1D6B4F}
.eqwhy{font-size:13.5px;color:var(--ink2);line-height:1.5}
.eqstep{font-size:13.5px;font-weight:600;color:var(--primary-d)}
.eqh{font-size:13.5px;background:#FFF7E0;border-radius:10px;padding:8px 10px;line-height:1.5}
.tsheet{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:10px 14px;border-radius:14px;border:1.5px dashed var(--line2);background:transparent;font:inherit;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;text-align:left}
.tsheet[hidden]{display:none!important}
.tsheet span{font-size:12px;font-weight:400;color:var(--muted)}
.tsheet:hover{border-color:var(--primary);color:var(--primary-d)}
@media (max-width:860px){.tsheet{width:auto;flex-direction:row;align-items:center;gap:8px;padding:6px 12px;align-self:flex-start}}
.panel{flex:1 1 280px;max-width:340px;min-width:0;display:flex;flex-direction:column;gap:14px}
.box{padding:18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.box h2{font-size:18px}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.ctl .n{font-size:15px;color:var(--ink2)}
.toggle{position:relative;flex:none;width:64px;height:36px;border:0;border-radius:99px;background:#C9CFDF;cursor:pointer;transition:background .2s}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.15);transition:left .2s}
.toggle[aria-checked="true"]{background:#2FA57A}
.toggle[aria-checked="true"]::after{left:32px}
.toggle:disabled{opacity:.45;cursor:not-allowed}

function fxNode(root){
  if(!root) return;
  if(root.nodeType===3){ fxText(root); return; }

  {sc:0, q:'จากตาราง ถ้าระยะห่างเป็น 40 cm แรงไฟฟ้าจะประมาณเท่าใด', o:['0.23 mN','0.45 mN','0.90 mN','1.80 mN'], a:0, why:'F ∝ 1/r² ระยะ 40 cm เป็น 4 เท่าของ 10 cm แรงจึงเหลือ 1/16 คือ 3.6 ÷ 16 ≈ 0.23 mN'},
  {sc:0, t:'yn', q:'ข้อความต่อไปนี้ถูกต้องหรือไม่', rows:[['ถ้าลดระยะห่างเหลือครึ่งหนึ่ง แรงจะเพิ่มเป็น 4 เท่า', true],['ถ้าประจุของทรงกลมลูกหนึ่งเพิ่มเป็น 2 เท่า แรงจะเพิ่มเป็น 2 เท่า', true],['ถ้าระยะห่างเพิ่มเป็น 2 เท่า แรงจะลดเหลือครึ่งหนึ่ง', false]], why:'F = kq₁q₂/r² แรงแปรผกผันกับ r² ระยะครึ่งหนึ่งแรงเพิ่ม 4 เท่า ระยะ 2 เท่าแรงเหลือ 1/4 · แรงแปรผันตรงกับประจุแต่ละลูก'},
  {sc:0, t:'yn', q:'ข้อความต่อไปนี้ถูกต้องหรือไม่', rows:[['ทรงกลมที่มีประจุมากกว่าออกแรงต่ออีกลูกมากกว่าแรงที่ได้รับกลับ', false],['ลูกโป่งที่มีประจุดูดเศษกระดาษที่เป็นกลางได้', true],['การถูลูกโป่งกับเส้นผมทำให้เกิดประจุขึ้นใหม่', false]], why:'แรงที่ทรงกลมทั้งสองกระทำต่อกันมีขนาดเท่ากันเสมอ (กิริยา–ปฏิกิริยา) · ลูกโป่งเหนี่ยวนำให้กระดาษด้านใกล้มีประจุตรงข้ามจึงดูดกัน · การถูแค่ย้ายอิเล็กตรอน ไม่ได้สร้างประจุใหม่'},
  {sc:0, t:'open', q:'{N}นำลูกโป่งที่ถูกับเส้นผมไปแตะผนัง ลูกโป่งติดผนังได้ ทั้งที่ผนังไม่มีประจุ อธิบายว่าเกิดขึ้นได้อย่างไร', model:'ประจุลบบนลูกโป่งผลักอิเล็กตรอนในผนังให้ออกห่าง ผิวผนังด้านใกล้จึงเป็นบวก (การเหนี่ยวนำ/แยกขั้ว) ประจุต่างชนิดอยู่ใกล้กว่า แรงดูดจึงมากกว่าแรงผลัก ลูกโป่งจึงติดผนัง'},
  /* part 2: field between parallel plates */
  {sc:1, q:'สนามไฟฟ้าระหว่างตะแกรงกลางกับตะแกรงนอกมีขนาดประมาณเท่าใด', o:['6 × 10⁵ V/m','600 V/m','5.4 V/m','6 × 10³ V/m'], a:0, why:'E = V/d = 1800 ÷ 0.003 = 6 × 10⁵ V/m (ต้องเปลี่ยน 3 mm เป็น 0.003 m)'},
  {sc:1, q:'ทำไมจึงเกิดประกายไฟเมื่อยุงบินเข้าไประหว่างตะแกรง', o:['ตัวยุงเชื่อมช่องว่างให้ประจุไหลผ่าน','ยุงมีประจุบวกสะสมมาตั้งแต่ก่อนบินเข้ามา','ตะแกรงดูดยุงเข้ามาด้วยแรงแม่เหล็ก','ปีกยุงเสียดสีกับตะแกรงจนเกิดความร้อน'], a:0, why:'ตะแกรงสองชั้นมีความต่างศักย์สูง เมื่อยุงเข้าไปอยู่ระหว่างตะแกรง ตัวยุงช่วยเชื่อมช่องว่าง ประจุจึงไหลผ่านตัวยุงและอากาศ เกิดประกายไฟ'},
  {sc:1, t:'yn', q:'ข้อความต่อไปนี้ถูกต้องหรือไม่', rows:[['ระหว่างตะแกรงที่ขนานกัน สนามไฟฟ้ามีขนาดเกือบเท่ากันทุกจุด', true],['สนามไฟฟ้าระหว่างตะแกรงชี้จากตะแกรงศักย์ต่ำไปตะแกรงศักย์สูง', false],['ถ้าความต่างศักย์เท่าเดิมแต่ตะแกรงห่างกันมากขึ้น สนามไฟฟ้าจะลดลง', true]], why:'สนามระหว่างแผ่นขนานสม่ำเสมอ · สนามไฟฟ้าชี้จากศักย์สูงไปศักย์ต่ำ · E = V/d ระยะมากขึ้น สนามลดลง'},
  {sc:1, t:'yn', q:'ข้อความต่อไปนี้ถูกต้องหรือไม่', rows:[['ทุกจุดบนตะแกรงโลหะแผ่นเดียวกันมีศักย์ไฟฟ้าเท่ากัน', true],['จุดกึ่งกลางระหว่างตะแกรงทั้งสองมีศักย์ต่างจากตะแกรงแต่ละแผ่น 900 V', true],['เลื่อนประจุไปในแนวขนานกับตะแกรงต้องทำงานมาก', false]], why:'ตัวนำทั้งแผ่นมีศักย์เท่ากัน · สนามสม่ำเสมอ ศักย์ลดลงเชิงเส้น ครึ่งระยะจึงต่างกันครึ่งหนึ่ง 1800 ÷ 2 = 900 V · แนวขนานกับตะแกรงเป็นแนวศักย์เท่า งานเป็นศูนย์'},
  {sc:1, t:'open', q:'{N}เผลอใช้นิ้วแตะตะแกรงนอกเพียงด้านเดียวแล้วไม่ถูกช็อต แต่เมื่อยุงตัวเล็กเข้าไปอยู่ระหว่างตะแกรงกลับเกิดประกายไฟ ใช้ความรู้เรื่องความต่างศักย์อธิบายความแตกต่างนี้', model:'แตะตะแกรงนอกด้านเดียว นิ้วสัมผัสจุดที่มีศักย์เดียวกัน ไม่มีความต่างศักย์คร่อมร่างกาย ประจุจึงไม่ไหลผ่าน แต่ยุงอยู่ระหว่างตะแกรงกลางกับตะแกรงนอกซึ่งต่างศักย์กัน 1800 V และห่างกันเพียง 3 mm สนามไฟฟ้าสูง ประจุจึงไหลผ่านตัวยุงเกิดประกายไฟ'},
  /* part 3: electrostatic precipitator */
  {sc:2, q:'ถ้าต่อความต่างศักย์ 5000 V กับแผ่นที่ห่างกัน 5 mm สนามไฟฟ้าระหว่างแผ่นเท่าใด', o:['1 × 10⁶ V/m','1 × 10⁴ V/m','2.5 × 10⁴ V/m','1 × 10³ V/m'], a:0, why:'E = V/d = 5000 ÷ 0.005 = 1 × 10⁶ V/m (ต้องเปลี่ยน 5 mm เป็น 0.005 m)'},
  {sc:2, q:'ที่ความต่างศักย์ 0 V เครื่องดักฝุ่นได้เพียง 5% เพราะอะไร', o:['ไม่มีสนามไฟฟ้า จึงไม่มีแรงไฟฟ้าดึงฝุ่น','ฝุ่นเล็กเกินกว่าแผ่นโลหะจะดักเอาไว้ได้ทัน','แผ่นโลหะร้อนเกินไปจนฝุ่นติดไม่ได้','พัดลมหยุดหมุนเมื่อไม่มีความต่างศักย์'], a:0, why:'เมื่อ V = 0 สนามไฟฟ้าระหว่างแผ่นเป็นศูนย์ ฝุ่นจึงไม่ถูกแรงไฟฟ้าดึง ที่ดักได้ 5% เป็นฝุ่นที่ชนแผ่นเอง'},
  {sc:2, t:'yn', q:'ข้อความต่อไปนี้ถูกต้องหรือไม่', rows:[['เพิ่มความต่างศักย์ระหว่างแผ่น ฝุ่นถูกดักได้มากขึ้น', true],['ลดระยะห่างระหว่างแผ่นโดยความต่างศักย์เท่าเดิม สนามไฟฟ้าจะลดลง', false],['เปิดพัดลมแรงขึ้น ฝุ่นจะอยู่ระหว่างแผ่นนานขึ้น', false]], why:'จากตาราง V มากขึ้นดักได้มากขึ้น · E = V/d ระยะลดลง สนามเพิ่มขึ้น · ลมแรงขึ้นฝุ่นผ่านเร็วขึ้น อยู่ในสนามสั้นลง'},
  {sc:2, t:'yn', q:'ข้อความต่อไปนี้ถูกต้องหรือไม่', rows:[['ฝุ่นที่มีประจุลบจะเคลื่อนไปหาแผ่นที่มีศักย์สูงกว่า', true],['แรงไฟฟ้าที่ฝุ่นได้รับขึ้นกับประจุของฝุ่นด้วย', true],['ฝุ่นที่ไม่มีประจุจะถูกแผ่นโลหะดึงได้แรงที่สุด', false]], why:'ประจุลบถูกแรงไฟฟ้าในทิศตรงข้ามสนาม จึงไปหาศักย์สูง · F = qE · ฝุ่นที่ไม่มีประจุ q = 0 แรงไฟฟ้าเป็นศูนย์'},
  {sc:2, t:'open', q:'เพื่อนของ{N}บอกว่า “ตั้งความต่างศักย์ให้สูงที่สุดเท่าที่ทำได้ดีที่สุด” {N}ควรเห็นด้วยหรือไม่ อธิบายเหตุผลโดยใช้ข้อมูลในตาราง', model:'เห็นด้วยบางส่วน ความต่างศักย์สูงขึ้น สนามไฟฟ้าและแรง F = qE มากขึ้นจึงดักฝุ่นได้มากขึ้น แต่จากตาราง 4000 → 6000 V ได้เพิ่มเพียง 20% และถ้าสูงเกินไปอาจเกิดประกายไฟ เกิดโอโซน เปลืองไฟ และอันตราย'},
  /* part 4: induction */
  {sc:3, q:'พื้นดินใต้เมฆมีประจุบวกปรากฏขึ้นได้อย่างไร', o:['ประจุลบในเมฆผลักอิเล็กตรอนที่ผิวดินออก','เมฆปล่อยประจุบวกลงมาที่พื้นดินก่อนฝนตก','พื้นดินมีประจุบวกอยู่แล้วตลอดเวลา','แสงแดดทำให้ผิวดินสูญเสียโปรตอน'], a:0, why:'การเหนี่ยวนำ ประจุลบในเมฆผลักอิเล็กตรอนที่ผิวดินให้เคลื่อนออกไป ผิวดินใต้เมฆจึงเหลือประจุบวก'},
  {sc:3, q:'ทำไมสายล่อฟ้าต้องต่อสายทองแดงลงไปในดิน', o:['ให้ประจุไหลลงดินโดยไม่ผ่านตัวอาคาร','ให้อาคารเก็บประจุไว้ได้มากขึ้น','ป้องกันไม่ให้เกิดเมฆฝนเหนือตัวอาคารสูง','ทำให้แท่งโลหะบนยอดอาคารเย็นลง'], a:0, why:'ทองแดงเป็นตัวนำที่ดี เมื่อฟ้าผ่า ประจุจะไหลผ่านสายทองแดงลงดิน ไม่ไหลผ่านโครงสร้างอาคารและคนข้างใน'},
  {sc:3, t:'yn', q:'ข้อความต่อไปนี้ถูกต้องหรือไม่', rows:[['การเหนี่ยวนำทำให้ประจุในตัวนำแยกออกจากกันได้โดยไม่ต้องสัมผัส', true],['ต่อตัวนำลงดินขณะมีประจุลบอยู่ใกล้ แล้วตัดสายดินก่อนนำประจุลบออก ตัวนำจะมีประจุบวก', true],['ในพื้นดิน ประจุบวกเคลื่อนที่ขึ้นไปหาเมฆได้ง่ายกว่าอิเล็กตรอน', false]], why:'การเหนี่ยวนำแยกประจุโดยไม่สัมผัส · ขณะต่อดิน อิเล็กตรอนถูกผลักลงดิน ตัดสายดินแล้วจึงเหลือประจุบวก · ในตัวนำ อิเล็กตรอนเป็นตัวที่เคลื่อนที่ ไม่ใช่ประจุบวก'},
  {sc:3, t:'yn', q:'ข้อความต่อไปนี้ถูกต้องหรือไม่', rows:[['ขณะฟ้าคะนอง ยืนหลบใต้ต้นไม้สูงกลางทุ่งปลอดภัย', false],['นั่งในรถยนต์ที่ปิดประตูสนิทปลอดภัยกว่ายืนกลางทุ่ง', true],['ประจุลบในเมฆเกิดขึ้นได้เองโดยไม่มีสิ่งใดเสียอิเล็กตรอนไป', false]], why:'ต้นไม้สูงเป็นจุดที่ฟ้าผ่าได้ง่าย · ตัวถังรถเป็นโลหะ ประจุไหลไปตามผิวด้านนอก · ประจุอนุรักษ์ เมฆได้อิเล็กตรอนมาจากการเสียดสีของหยดน้ำและเกล็ดน้ำแข็ง'},
  {sc:3, t:'open', q:'อธิบายว่าทำไมการที่{N}กางร่มด้ามโลหะยืนกลางสนามโล่งขณะฟ้าคะนองจึงอันตราย', model:'ร่มทำให้เป็นจุดสูงสุดในสนาม ปลายโลหะแหลมมีประจุเหนี่ยวนำสะสมหนาแน่น สนามไฟฟ้ารอบปลายสูง ฟ้าจึงผ่าลงจุดนั้นได้ง่าย และโลหะนำประจุผ่านร่างกายลงดิน'},
  /* part 5: capacitor */
  {sc:4, q:'ตัวเก็บประจุของเครื่อง AED เก็บประจุได้เท่าใด', o:['0.2 C','2 C','0.02 C','20 C'], a:0, why:'Q = CV = 100 × 10⁻⁶ F × 2000 V = 0.2 C'},
  {sc:4, q:'ตัวเก็บประจุนี้สะสมพลังงานได้เท่าใด', o:['200 J','400 J','100 J','0.2 J'], a:0, why:'U = ½CV² = ½ × 100 × 10⁻⁶ × 2000² = 200 J'},

  const key = k => { const [lb, kd] = KL[k] || [k,'d']; const cn = KL[k] && k.startsWith('c:') ? CONSTS.find(x=>'c:' + x[2]===k) : null;
    return `<button type="button" data-act="calc" data-k="${k}" class="k-${kd}${want===k ? ' blink' : ''}"${cn ? ` title="${cn[4]} = ${cn[3]}"` : ''}><span class="kl">${lb}</span>${cn ? `<small>${cn[3]}</small>` : ''}</button>`; };
  if(!c.open) return `<button type="button" class="calchd" data-act="calc" data-k="toggle"><b>🧮 เครื่องคิดเลข</b><span class="note">แตะเพื่อเปิด ▸</span></button>`;
  return `<button type="button" class="calchd" data-act="calc" data-k="toggle"><b>🧮 เครื่องคิดเลข</b><span class="note">${c.deg ? 'DEG' : 'RAD'} · พับ ▾</span></button>
    <div class="scr" data-act="calcscr"><div class="ex">${rRow(c.root)}</div><div class="rs">${c.res ? '= ' + esc(c.res) : '&nbsp;'}</div></div>
    ${c.seq ? `<div class="seqbar">กดปุ่มที่กะพริบตามลำดับ (${Math.min(c.si, c.seq.length)}/${c.seq.length}) <button type="button" class="linkbtn" data-act="calc" data-k="stopseq">หยุด</button></div>` : ''}
    <div class="tabs">${TABS.map((t,i)=>`<button type="button" data-act="calc" data-k="tab:${i}" class="${c.tab===i ? 'on' : ''}${wantTab===i && c.tab!==i ? ' blink' : ''}">${t[0]}</button>`).join('')}</div>
    <div class="keys${c.tab===3 ? ' kc' : ''}">${TABS[c.tab][1].map(key).join('')}</div>
    <div class="keys kb">${BOTTOM.map(key).join('')}</div>
    ${c.hist.length ? `<div class="hist">${c.hist.map(h=>`<div>${h}</div>`).join('')}</div>` : ''}`; }
function calcRender(){ const el = $('#calc'); if(el) el.innerHTML = calcHTML(); }
function calcKey(k){ const c = CALC;
  if(c.seq && k===c.seq[c.si]){ c.si += 1; if(c.si >= c.seq.length){ c.seq = null; toast('กดครบตามลำดับแล้ว ดูผลลัพธ์บนจอ'); } }
  if(k==='stopseq'){ c.seq = null; calcRender(); return; }
  if(k==='toggle'){ c.open = !c.open; const el = $('#calc'); if(el) el.classList.toggle('shut', !c.open); calcRender(); return; }
  if(k.startsWith('tab:')){ c.tab = +k.slice(4); calcRender(); return; }
  if(c.res && !['left','right','bs','toIn','deg','eq'].includes(k) && !k.startsWith('tab:')){ /* new calc after result */ if(/^[+−×÷]$/.test(k) || k==='sq' || k==='pow' || k==='inv'){ c.root = [{t:'c', v:'Ans'}]; c.cur = c.root; c.i = 1; } else if(c.root.length){ c.root = []; c.cur = c.root; c.i = 0; } c.res = ''; }
  const ch = v => insNode({t:'c', v});
  if(/^\d$/.test(k) || ['.','+','−','×','÷'].includes(k)) ch(k);
  else if(k==='neg') ch('−'); else if(k==='pi') ch('π'); else if(k==='ans') ch('Ans');
  else if(k==='par') insNode({t:'par', a:[]}); else if(k==='frac'){ const n = {t:'frac', n:[], d:[]}; insNode(n); }
  else if(k==='sqrt') insNode({t:'sqrt', a:[]}); else if(k==='sq'){ insNode({t:'sup', a:[{t:'c', v:'2'}]}); moveRight(); moveRight(); }
  else if(k==='inv'){ insNode({t:'sup', a:[{t:'c', v:'−'},{t:'c', v:'1'}]}); moveRight(); moveRight(); moveRight(); }
  else if(k==='pow') insNode({t:'sup', a:[]}); else if(k==='e10') insNode({t:'e10', a:[]}); else if(k==='p10') insNode({t:'p10', a:[]});
  else if(k==='exp') insNode({t:'exp', a:[]}); else if(k==='abs') insNode({t:'abs', a:[]});
  else if(['log','ln','sin','cos','tan','cot'].includes(k)) insNode({t:'fn', f:k, a:[]});
  else if(['asin','acos','atan'].includes(k)) insNode({t:'fn', f:{asin:'sin⁻¹',acos:'cos⁻¹',atan:'tan⁻¹'}[k], a:[]});
  else if(k.startsWith('c:')){ const cn = CONSTS.find(x=>'c:' + x[2]===k); insNode({t:'k', v:cn[0]}); }
  else if(k==='left') moveLeft(); else if(k==='right') moveRight(); else if(k==='bs'){ backspace(); c.res = ''; }
  else if(k==='ac'){ c.root = []; c.cur = c.root; c.i = 0; c.res = ''; }
  else if(k==='deg') c.deg = !c.deg;
  else if(k==='eq'){ const v = calcEval(); c.res = calcFmt(v); if(typeof v==='number' && isFinite(v)){ c.ans = v; RID = 0; c.hist.unshift(`<span class="hx">${rRow(c.root).replace(/<i class="cur"><\/i>/g,'')}</span> = ${esc(c.res)}`); c.hist = c.hist.slice(0, 4); } }
  else if(k==='toIn'){ if(c.ans===null){ toast('กด = ก่อนครับ'); return; } const inp = (ui.lastIn && document.getElementById(ui.lastIn)) || $('#helper input') || $('#pCtrl input'); if(!inp){ toast('ยังไม่มีช่องคำตอบตอนนี้'); return; } inp.value = String(+c.ans.toPrecision(5)); inp.focus(); toast('ใส่ค่าแล้ว ตรวจหน่วยก่อนกดตรวจนะครับ'); }
  calcRender(); }
function calcTapScreen(e){ const r = e.target.closest('[data-row]'); if(!r || !ROWS[r.dataset.row]) return; CALC.cur = ROWS[r.dataset.row]; CALC.i = CALC.cur.length; calcRender(); }
function calcSeq(keys){ CALC.open = true; const ce = $('#calc'); if(ce) ce.classList.remove('shut'); CALC.seq = keys.slice(); CALC.si = 0; CALC.root = []; CALC.cur = CALC.root; CALC.i = 0; CALC.res = ''; CALC.tab = tabOf(keys[0]); calcRender(); const el = $('#calc'); if(el) el.scrollIntoView({behavior:'smooth', block:'nearest'}); }
/* number -> key sequence: "0.06" or [m, e] scientific */
function numKeys(x, sig=4){ if(x===0) return ['0']; const a = Math.abs(x), neg = x < 0 ? ['neg'] : [];
  if(a >= 1e4 || a < 1e-2){ const e = Math.floor(Math.log10(a)), m = +(a/Math.pow(10, e)).toPrecision(sig); return neg.concat(String(m).split(''), ['e10'], e < 0 ? ['neg'] : [], String(Math.abs(e)).split(''), ['right']); }
  return neg.concat(String(+a.toPrecision(sig)).split('')); }

const HELP = {def:null, k:0, msg:''};
function helpOpen(def){ HELP.def = def; HELP.k = 0; HELP.msg = ''; helpRender(); const el = $('#helper'); if(el) el.scrollIntoView({behavior:'smooth', block:'nearest'}); }
function helpRender(){ const el = $('#helper'); if(!el) return; const d = HELP.def; if(!d){ el.innerHTML = ''; el.hidden = true; return; } el.hidden = false;
  const st = d.steps[HELP.k], n = d.steps.length;
  el.innerHTML = `<div class="row spread"><b>💡 ${d.title}</b><button type="button" class="linkbtn" data-act="help" data-k="close">ปิด</button></div>
    <div class="hdots">${d.steps.map((s,j)=>`<span class="${j < HELP.k ? 'ok' : j===HELP.k ? 'on' : ''}">${j + 1}</span>`).join('')}</div>
    <div class="hst"><div class="ht">${st.h}</div><div>${st.body || ''}</div>
    ${st.keys ? `<div class="kseq">${st.keys.map(k=>`<span>${(KL[k] || [k])[0]}</span>`).join('')}</div><button type="button" class="btn ghost sm" data-act="help" data-k="blink">✨ ให้ปุ่มกะพริบบนเครื่องคิดเลข</button>` : ''}
    ${st.ans!==undefined ? `<div class="row" style="gap:6px;flex-wrap:nowrap;margin-top:8px"><input id="hin" inputmode="decimal" placeholder="${st.ph || 'คำตอบของขั้นนี้'}" style="flex:1;min-width:0;padding:8px 10px;border:1.5px solid #D6DCEA;border-radius:10px;font:inherit;font-size:15px"><button type="button" class="btn sm" data-act="help" data-k="check">ตรวจ</button></div>` : ''}
    ${HELP.msg ? `<div class="hmsg">${HELP.msg}</div>` : ''}</div>
    <div class="row spread" style="margin-top:8px">${HELP.k ? '<button type="button" class="btn ghost sm" data-act="help" data-k="prev">◀ ย้อน</button>' : '<span></span>'}
    ${st.ans===undefined ? (HELP.k < n - 1 ? '<button type="button" class="btn sm" data-act="help" data-k="next">ถัดไป ▶</button>' : '<button type="button" class="btn ok sm" data-act="help" data-k="close">เข้าใจแล้ว</button>') : ''}</div>`; }
function helpKey(k){ const d = HELP.def; if(!d) return; const st = d.steps[HELP.k];
  if(k==='close'){ HELP.def = null; helpRender(); return; }
  if(k==='prev'){ HELP.k = Math.max(0, HELP.k - 1); HELP.msg = ''; }
  else if(k==='next'){ HELP.k = Math.min(d.steps.length - 1, HELP.k + 1); HELP.msg = ''; }
  else if(k==='blink'){ calcSeq(st.keys); return; }
  else if(k==='check'){ const raw = ($('#hin') || {}).value, x = parseFloat(String(raw || '').replace(',', '.').replace('−','-'));
    if(!isFinite(x)){ HELP.msg = 'พิมพ์ตัวเลขก่อนครับ'; }
    else { const tol = st.tol || .02, ok = st.abs ? Math.abs(x - st.ans) <= st.abs : Math.abs(x - st.ans) <= Math.abs(st.ans)*tol + 1e-30;
      if(ok){ HELP.msg = ''; toast('ถูกต้อง ไปขั้นต่อไป'); if(HELP.k < d.steps.length - 1) HELP.k += 1; else { HELP.def = null; } }
      else { const b = (st.bad || []).find(([v, , t])=>Math.abs(x - v) <= Math.abs(v)*(t || .02) + 1e-30); HELP.msg = b ? b[1] : (st.no || 'ยังไม่ถูกครับ ลองดูวิธีในขั้นนี้อีกครั้ง หรือกดให้ปุ่มกะพริบแล้วกดตาม'); } } }
  helpRender(); }

function revState(){ if(!S.rev || typeof S.rev!=='object') S.rev = {}; const r = S.rev; r.place = r.place || {}; r.refl = r.refl || {}; r.tries = r.tries || 0; r.card = r.card || {name:'', id:''}; return r; }
const revDone = () => { const r = S.rev; return !!(r && r.mapDone && PARTS.every((p,i)=>r.refl && r.refl[i] && r.refl[i].done)); };
const stableShuf = (n, seed) => { const a = [...Array(n).keys()]; let s = seed; for(let i=n-1;i>0;i--){ s = (s*9301 + 49297) % 233280; const j = Math.floor(s/233280*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
function vReview(){
  const r = revState(), M = CMAP, sel = ui.cmSel || null;
  if(!r.chipOrd) r.chipOrd = stableShuf(M.chips.length, 7 + (S.nick || '').length*13);
  const used = new Set(Object.values(r.place));

/* ---------- PDF ---------- */
async function makePdf(btn){
  const el = $('#pdfsheet'), pages = sheetPages();
  const label = btn.innerHTML; btn.disabled = true; btn.textContent = 'กำลังสร้าง PDF...';
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const pdf = new window.jspdf.jsPDF('p','mm','a4');
    for(let k=0;k<pages.length;k++){
      el.innerHTML = pages[k]; fxNode(el); el.style.left = '0px'; el.style.zIndex = '-1';
      let canvas;
      try { canvas = await html2canvas(el.firstElementChild, {scale:2, backgroundColor:'#ffffff', scrollX:0, scrollY:0, windowWidth:1024}); }
      finally { el.style.left = '-12000px'; el.style.zIndex = ''; }
      if(k) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);
    }
    el.innerHTML = '';
    const data = pdf.output('arraybuffer');
    const dl = window.claude ? await window.claude.use('downloads') : window.__fbDL;
    if(!dl){ toast('ดาวน์โหลดไม่ได้ในหน้านี้ ลองเปิดลิงก์ในเบราว์เซอร์'); }
    else {
      try { await dl.save({filename:CONF.file, data}); S.sheetDone = true; save(); renderRail(); toast('ดาวน์โหลดใบกิจกรรมแล้ว นำไปปริ้นได้เลย'); }
      catch(err){ if(err && err.code==='declined') toast('ยกเลิกการดาวน์โหลด'); else if(err && err.code==='rate_limited') toast('รอสักครู่แล้วลองใหม่'); else toast('ดาวน์โหลดไม่สำเร็จ ลองใหม่อีกครั้ง'); }
    }
  }catch(e){ toast('สร้าง PDF ไม่สำเร็จ ลองใหม่อีกครั้ง'); }
  btn.disabled = false; btn.innerHTML = label;
}

    else if(v==='c') act(()=>checkC(val('cv5'))); else if(v.startsWith('c:')) act(()=>{ const so = cSol(); checkC(v.slice(2)==='auto' ? String(so ? so.t : '') : v.slice(2)); });
    else if(v==='ca') act(()=>setA());
    else if(v.startsWith('as:')) act(()=>setA(+v.slice(3)));
    else if(v.startsWith('ans:')){ const [,q,a] = v.split(':'); answer(q, a); }
  }

  /* ----- pointer ----- */
  let drag = null; const ndc = new THREE.Vector2();
  function pick(e){ const r = R.renderer.domElement.getBoundingClientRect(); ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1); R.raycaster.setFromCamera(ndc, R.camera); }
  function rootOf(o){ while(o && !o.userData.id) o = o.parent; return o; }
  function bindPointer(){
    const el = R.renderer.domElement;
    const DRG = () => P.i===0 ? [P.A] : P.i===1 ? [P.pr] : P.i===2 ? [P.kn, P.fan] : P.i===3 ? [P.rod, P.gp, P.rod2] : [P.mp, P.kn];
    el.addEventListener('pointerdown', e=>{
      if(drag && performance.now() - (drag.ts || 0) > 1500){ drag = null; R.controls.enabled = true; }
      if(!P || drag) return; pick(e);
      const h = R.raycaster.intersectObjects(R.world.children, true).find(x=>rootOf(x.object));
      let g = h ? rootOf(h.object) : null; const lim = Math.max(60, el.clientWidth*.1);
      if(!g){ let best = lim; DRG().forEach(o=>{ if(!o) return; const p = scr(o.getWorldPosition(V(0,0,0)).add(V(0, o.userData.hy!=null ? o.userData.hy : (P.i===0 ? SY - TABLE_Y : .3), 0))); const dd = Math.hypot(p.x - e.clientX, p.y - e.clientY); if(dd < best){ best = dd; g = o; } }); }
      if(!g) return;
      drag = {id:g.userData.id, x:e.clientX, y:e.clientY, pid:e.pointerId, moved:false, V0:P.i===2 ? P.s.kv : P.s.cV, ts:performance.now()};
      if(drag.id==='rod' || drag.id==='plate' || drag.id==='A' || drag.id==='probe') SFX.pick();
      e.stopImmediatePropagation(); e.preventDefault(); R.controls.enabled = false; try{ el.setPointerCapture(e.pointerId); }catch(_){}
    }, {capture:true});
    el.addEventListener('pointermove', e=>{ if(!drag || e.pointerId!==drag.pid) return; drag.ts = performance.now(); if(!drag.moved && Math.abs(e.clientX-drag.x) + Math.abs(e.clientY-drag.y) > 5) drag.moved = true; if(!drag.moved || drag.id==='gnd' || drag.id==='fan' || drag.id==='rod2' || /^as:/.test(drag.id || '')) return;
      pick(e); const pt = new THREE.Vector3(), s = P.s;
      if(drag.id==='A'){ if(!R.raycaster.ray.intersectPlane(new THREE.Plane(UP, -SY), pt)) return; const r0 = s.r; s.r = Math.max(.06, Math.min(.45, Math.round((XB - pt.x)/KS*100)/100)); if(s.r!==r0) SFX.tick(); updP1(); }
      else if(drag.id==='probe'){ if(!R.raycaster.ray.intersectPlane(new THREE.Plane(UP, -PY), pt)) return; const h = hw(); s.px = Math.max(-h + .01, Math.min(h - .01, Math.round((pt.x)/KD*1000)/1000*KD)); s.pz = Math.max(-.45, Math.min(.45, Math.round(pt.z*20)/20)); updP2(); }
      else if(drag.id==='rod'){ if(!R.raycaster.ray.intersectPlane(new THREE.Plane(UP, -KY), pt)) return; if(drag.off==null) drag.off = pt.x - P.rod.position.x; let gp = KX - .07 - (pt.x - drag.off); if(gp < .03) gp = 0; const g0 = s.gap; setGap(gp); if(Math.abs(s.gap - g0) > .04) SFX.tick(); P.dirty = true; updP4(); }
      else if(drag.id==='plate'){ if(!R.raycaster.ray.intersectPlane(new THREE.Plane(UP, -P.cy), pt)) return; if(drag.px==null){ drag.px = pt.x; drag.d0 = s.cd; } const d = Math.max(1, Math.min(10, drag.d0 + Math.round((pt.x - drag.px)/.07))); if(d!==s.cd){ s.cd = d; SFX.tick(); updP5(); P.dirty = true; } }
      else if(drag.id==='knob'){ const dv = drag.y - e.clientY + (e.clientX - drag.x)*.5;
        if(P.i===2){ const v = Math.max(0, Math.min(VMAX, Math.round(drag.V0 + dv*.12))); if(v!==s.kv){ s.kv = v; SFX.tick(); updP3(); P.dirty = true; } }
        else { const v = Math.max(0, Math.min(300, Math.round((drag.V0 + dv*1.2)/5)*5)); if(v!==s.cV){ s.cV = v; SFX.tick(); updP5(); P.dirty = true; } } } });
    const end = e=>{ if(!drag || e.pointerId!==drag.pid) return; const d = drag; drag = null; R.controls.enabled = true;
      if(d.id==='gnd'){ if(!d.moved) act(()=>setGnd(!P.s.gnd)); return; }
      if(d.id==='fan'){ if(!d.moved) action('sp'); return; }
      if(/^as:/.test(d.id || '')){ if(!d.moved) action(d.id); return; }
      if(d.id==='rod2'){ if(!d.moved) action('rod'); return; }
      if(d.id==='A') act(()=>setR(P.s.r)); else if(d.id==='probe') act(()=>{ updP2(); rec2(); });
      else if(!d.moved) return;
      else if(d.id==='rod'){ SFX.drop(); act(()=>{}); }
      else if(d.id==='plate'){ SFX.drop(); act(rec5); }
      else if(d.id==='knob') act(()=>{ if(P.i===2) rec3(); else rec5(); }); };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end); window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
  }

  /* ----- loop ----- */
  let last = 0, uiT = 0;
  function tick(t){
    if(!R.active) return;
    requestAnimationFrame(tick);
    const dt = Math.min(.05, (t-last)/1000 || 0); last = t;
    R.controls.update();
    if(P){
      const s = P.s; P.tt += dt;
      if(P.i===2 && P.dust) tick3(dt); else SFX.amb({});
      if(P.i===1 && P.eqp && P.eqp.length){ const eo = P.s.fl !== false && eqSolved(); if(P.eqp[0].visible !== eo){ P.eqp.forEach(o=>o.visible = eo); if(eo) toast('ปลดล็อกเส้นศักย์เท่าแล้ว'); } }
      if(P.i===3 && P.lv){ const ql = q4().ql, ang = Math.min(.75, .16*Math.abs(ql)); P.lv.forEach(g=>{ g.rotation.z += (g.userData.sd*ang - g.rotation.z)*Math.min(1, dt*6); }); }
      uiT += dt; if(uiT > .3){ uiT = 0; if(check()) refresh(); else if(!(document.activeElement && document.activeElement.tagName==='INPUT')) refreshUI(); }
      if(P.dirty){ P.dirty = false; refresh(); }
      placeLabels();
    }
    R.renderer.render(R.scene, R.camera);
  }


  /* ----- labels ----- */
  function labelsDOM(){ const box = $('#labels'); if(box) box.innerHTML = P.labels.map((l,k)=>`<div data-l="${k}"></div>`).join(''); }
  const v3 = new THREE.Vector3();
  function placeLabels(){
    const box = $('#labels'); if(!box) return; const w = box.clientWidth, h = box.clientHeight;
    box.querySelectorAll('[data-l]').forEach(el=>{
      const l = P.labels[+el.dataset.l]; if(!l) return; const t = l.text();
      if(!t || !l.obj.visible){ el.hidden = true; return; }
      l.obj.getWorldPosition(v3); v3.y += l.dy; v3.project(R.camera);
      el.style.transform = `translate(${(v3.x*.5+.5)*w}px, ${(-v3.y*.5+.5)*h}px) translate(-50%,-100%)`;
      el.hidden = v3.z > 1; if(el.textContent !== t) el.textContent = t;
    });
  }
  function resize(){ const box = $('#stage'); if(!box || !R) return; const w = box.clientWidth, h = box.clientHeight; if(!w || !h) return; R.renderer.setSize(w, h, false); R.camera.aspect = w/h; { const f0 = R.camera.userData.f0 || (R.camera.userData.f0 = R.camera.fov), a = w/h; R.camera.fov = a < 1.25 ? Math.min(80, 2*Math.atan(Math.tan(f0*Math.PI/360)*1.25/a)*180/Math.PI) : f0; } R.camera.updateProjectionMatrix(); }
  function camRotate(a){ const off = R.camera.position.clone().sub(R.controls.target); off.applyAxisAngle(UP, a); R.camera.position.copy(R.controls.target).add(off); }
  function camZoom(f){ const off = R.camera.position.clone().sub(R.controls.target); off.setLength(Math.max(R.controls.minDistance, Math.min(R.controls.maxDistance, off.length()*f))); R.camera.position.copy(R.controls.target).add(off); }

  return {
    mount(i){
      const box = $('#stage');
      if(!initR()){ box.innerHTML = `<div class="overlay"><div class="card"><h2>เปิดห้องแลป 3 มิติไม่ได้</h2><p class="note" style="margin:0">อุปกรณ์หรือเบราว์เซอร์นี้ไม่รองรับกราฟิก 3 มิติ ลองเปิดด้วย Chrome หรือ Safari รุ่นใหม่ หรือรีเฟรชหน้าอีกครั้ง</p></div></div>`; return; }
      box.prepend(R.renderer.domElement);
      if(!P || P.i!==i){ P = fresh(i); build(); }
      else { P.celebrate = false; P.ctrlSig = ''; labelsDOM(); refreshUI(); }
      if(R.ro) R.ro.disconnect(); R.ro = new ResizeObserver(resize); R.ro.observe(box); resize();
      if(!R.active){ R.active = true; requestAnimationFrame(tick); }
    },
    stop(){ SFX.amb({}); if(R){ R.active = false; if(R.ro) R.ro.disconnect(); } },
    refreshUI(){ if(P){ P.ctrlSig = ''; refreshUI(); } },
    action
  };
})();

/* boot */
render();
if(UPART!=null){ ui.cp = UPART; }
showNick();
})();
</script>
