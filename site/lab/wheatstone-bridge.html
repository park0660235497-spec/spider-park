<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>วีทสโตนบริดจ์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F7;--card:#FFFFFF;--ink:#1D2433;--mute:#5B6475;--line:#D7DEE8;--pri:#1F6FEB;--pri2:#E7F0FE;--ok:#1F8A63;--okb:#E5F5EE;--bad:#C0392B;--badb:#FDECEA;--warn:#B7791F;--warnb:#FFF6E0;--chip:#F2F5F9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151C;--card:#1A202B;--ink:#E7ECF3;--mute:#9AA5B6;--line:#2C3544;--pri:#5B9BFF;--pri2:#1C2B45;--ok:#4CC08F;--okb:#163126;--bad:#FF7B6B;--badb:#3A1E1B;--warn:#F0B94D;--warnb:#3A2F15;--chip:#232B38}}
:root[data-theme="dark"]{--bg:#11151C;--card:#1A202B;--ink:#E7ECF3;--mute:#9AA5B6;--line:#2C3544;--pri:#5B9BFF;--pri2:#1C2B45;--ok:#4CC08F;--okb:#163126;--bad:#FF7B6B;--badb:#3A1E1B;--warn:#F0B94D;--warnb:#3A2F15;--chip:#232B38}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Sarabun,system-ui,sans-serif;font-size:15px}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0;flex:1;min-width:150px}
.tabs{display:flex;gap:6px}
.tab{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-weight:600;cursor:pointer}
.tab.on{background:var(--pri);border-color:var(--pri);color:#fff}
#app{display:flex;flex-direction:column;height:calc(100% - 50px)}
#view{position:relative;height:54vh;min-height:300px;background:#DDE5EE;touch-action:none;overflow:hidden}
#c{width:100%;height:100%;display:block}
#labels{position:absolute;inset:0;pointer-events:none}
.dl{position:absolute;transform:translate(-50%,-100%);background:rgba(20,28,40,.78);color:#fff;font-size:11px;padding:2px 6px;border-radius:6px;white-space:nowrap}
#camBtns{position:absolute;left:8px;bottom:8px;display:flex;gap:6px;flex-wrap:wrap}
#camBtns button,#readout button{font:inherit;font-size:12px;border:none;border-radius:8px;padding:6px 9px;background:rgba(255,255,255,.92);color:#1D2433;box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:pointer}
#camBtns button.on{background:#1F6FEB;color:#fff}
#readout{position:absolute;right:8px;top:8px;background:rgba(255,255,255,.92);color:#1D2433;border-radius:10px;padding:6px 9px;font-size:12px;line-height:1.45;box-shadow:0 1px 3px rgba(0,0,0,.2);max-width:56%}
#readout b{font-variant-numeric:tabular-nums}
#selTip{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:#FFF3C4;color:#5a4300;border-radius:10px;padding:5px 10px;font-size:12.5px;display:none;box-shadow:0 1px 3px rgba(0,0,0,.2);max-width:60%;text-align:center}
#toast{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);background:rgba(20,28,40,.9);color:#fff;padding:7px 12px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
#panel{flex:1;overflow:auto;padding:10px 12px 40px;-webkit-overflow-scrolling:touch}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:15px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}
.btn{font:inherit;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:9px;padding:7px 10px;cursor:pointer;min-height:36px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.btn.on{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:700}
.btn.sm{padding:4px 8px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.45}
.mute{color:var(--mute);font-size:13px}
.big{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.wl{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.wi{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--chip);border-radius:8px;padding:4px 6px}
.wi .dot{width:10px;height:10px;border-radius:50%;flex:none}
.wi span{flex:1}
.wi.sel{outline:2px solid var(--pri)}
.diag{margin:6px 0 0;padding:0;list-style:none;font-size:13.5px}
.diag li{padding:2px 0}
.fbox{background:var(--warnb);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;text-align:center;font-size:16px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.15}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.fr>span{padding:0 3px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:4px 5px;text-align:center}
th{background:var(--chip);font-weight:600}
.tw{overflow-x:auto}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
details{margin-top:4px}
summary{cursor:pointer;font-weight:600}
details ol{padding-left:20px;margin:6px 0}
details li{margin-bottom:6px;line-height:1.5}
#graph{width:100%;height:220px;display:block;background:#fff;border:1px solid var(--line);border-radius:8px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#modal.show{display:flex}
#modal .box{background:var(--card);color:var(--ink);border-radius:14px;padding:12px;max-width:640px;width:100%;max-height:92vh;overflow:auto}
#modal svg{width:100%;height:auto;background:#fff;border-radius:8px}
#microC{width:100%;height:auto;background:#fff;border-radius:8px;display:block}
input.num{font:inherit;width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
@media (min-width:900px){
 #app{flex-direction:row}
 #view{height:100%;flex:1.6}
 #panel{flex:1;max-width:460px;border-left:1px solid var(--line)}
}
</style>
</head>
<body>
<header>
 <h1>วีทสโตนบริดจ์ และสภาพต้านทานของลวด</h1>
 <div class="tabs"><button class="tab" data-p="0">ตอนที่ 1</button><button class="tab" data-p="1">ตอนที่ 2</button></div>
</header>
<div id="app">
 <div id="view">
  <canvas id="c"></canvas>
  <div id="labels"></div>
  <div id="readout"></div>
  <div id="selTip"></div>
  <div id="camBtns"></div>
  <div id="toast"></div>
 </div>
 <aside id="panel"></aside>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fx=(v,n)=>Number(v).toFixed(n);
const FR=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;

/* ---------- constants ---------- */
const R1N=[10,47,100,220,1000];
const RXSETS=[[27,33,39],[56,68,82],[120,150,180]];
const MATS=[{n:'นิโครม',rho:1.10e-6,col:0x9EA4AA},{n:'คอนสแตนแทน',rho:4.9e-7,col:0xC98E5C},{n:'ทังสเตน',rho:5.6e-8,col:0x5E636B}];
const DIAS=[0.20,0.30,0.40,0.50];
const AR=[{k:'A2m',t:'2mA',fs:2e-3,r:50,sc:2,u:'mA',m:1e3},{k:'A10m',t:'10mA',fs:1e-2,r:10,sc:10,u:'mA',m:1e3},{k:'A100m',t:'100mA',fs:.1,r:1,sc:100,u:'mA',m:1e3},{k:'A05',t:'0.5A',fs:.5,r:.2,sc:.5,u:'A',m:1},{k:'A5',t:'5A',fs:5,r:.02,sc:5,u:'A',m:1}];
const MM=[['off','ปิด'],['o200','Ω 200'],['o2k','Ω 2k'],['o20k','Ω 20k'],['v200m','V 200m'],['v2','V 2'],['v20','V 20']];
const RW=2.0, EA=.006, EC=.004, RG=60, GDIV=10e-6, RS=.02, ILIM=3, ITEST=5e-4;
const BAND=['#111','#7a4a1e','#d01c1c','#f07b12','#f2d21b','#2a9a3a','#1f4fd6','#7d3cc8','#888','#f4f4f4'];

const TN={'S+':'ขั้ว + แหล่งจ่าย','S-':'ขั้ว − แหล่งจ่าย',A:'ปลาย A ลวดบริดจ์',C:'ปลาย C ลวดบริดจ์',D:'จุดสัมผัส D',G1:'ขั้วซ้าย G',G2:'ขั้วขวา G',
 R1a:'R₁ ขาซ้าย',R1b:'R₁ ขาขวา',X1a:'Rx1 ขาซ้าย',X1b:'Rx1 ขาขวา',X2a:'Rx2 ขาซ้าย',X2b:'Rx2 ขาขวา',X3a:'Rx3 ขาซ้าย',X3b:'Rx3 ขาขวา',
 MC:'COM มัลติมิเตอร์',MV:'VΩ มัลติมิเตอร์',WL:'ปลายซ้ายลวด (0 cm)',WR:'ปลายขวาลวด (100 cm)',WK:'คลิป K',AC:'COM แอมมิเตอร์',
 A2m:'แอมมิเตอร์ 2mA',A10m:'แอมมิเตอร์ 10mA',A100m:'แอมมิเตอร์ 100mA',A05:'แอมมิเตอร์ 0.5A',A5:'แอมมิเตอร์ 5A'};

/* ---------- state ---------- */
const KEY='parkilab-wheatstone-v1';
function fresh(){
  const rx=RXSETS.map(s=>{const n=pick(s);return {n,t:n*(1+rnd(-.045,.045))};});
  const r1=R1N.map(n=>n*(1+rnd(-.004,.004)));
  const rho=MATS.map(m=>m.rho*(1+rnd(-.03,.03)));
  const dt={};MATS.forEach((m,i)=>DIAS.forEach((d,j)=>{dt[i+'-'+j]=Math.round(d*(1+rnd(-.015,.015))*1000)/1000;}));
  return {v:1,part:0,wires:[[],[]],sup:[{on:false,V:1.0,mode:'V'},{on:false,V:1.0,mode:'V'}],mm:['off','off'],jx:.5,kx:.5,r1i:2,
    rx,r1,rho,dt,mat:0,dia:1,rec1:{},rec2:{},dmeas:{},cam:[0,0],dpos:[{},{}],lock:false};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){S=null;}
if(!S||S.v!==1)S=fresh();
if(!S.dpos)S.dpos=[{},{}];if(S.lock===undefined)S.lock=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let sel=null, selWire=-1, panelSig='';

/* ---------- three setup ---------- */
const view=$('#view'), canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xEFF3F8);
const camera=new THREE.PerspectiveCamera(42,1,.01,20);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true;controls.dampingFactor=.12;controls.enablePan=false;controls.minDistance=.18;controls.maxDistance=2.6;controls.maxPolarAngle=1.45;
scene.add(new THREE.HemisphereLight(0xffffff,0xC9B79C,.95));
const sun=new THREE.DirectionalLight(0xffffff,.75);sun.position.set(.6,1.6,1.0);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-1,right:1,top:1,bottom:-1,near:.1,far:4});scene.add(sun);
// table
const woodTex=(()=>{const c=document.createElement('canvas');c.width=1024;c.height=512;const g=c.getContext('2d');g.fillStyle='#C4955F';g.fillRect(0,0,1024,512);
  for(let i=0;i<140;i++){const y=Math.random()*512;g.strokeStyle=`rgba(${110+Math.random()*40|0},${70+Math.random()*25|0},${35+Math.random()*20|0},${.12+Math.random()*.18})`;g.lineWidth=1+Math.random()*3;g.beginPath();g.moveTo(0,y);
  for(let x=0;x<=1024;x+=64)g.lineTo(x,y+Math.sin(x/90+i)*4+Math.random()*2);g.stroke();}
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;})();
const table=new THREE.Mesh(new THREE.BoxGeometry(2.0,.04,1.3),new THREE.MeshStandardMaterial({map:woodTex,roughness:.7}));
table.position.set(0,-.02,.05);table.receiveShadow=true;scene.add(table);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(8,8),new THREE.MeshStandardMaterial({color:0xC7CCD6}));floor.rotation.x=-Math.PI/2;floor.position.y=-.75;scene.add(floor);
const wall=new THREE.Mesh(new THREE.PlaneGeometry(8,4),new THREE.MeshStandardMaterial({color:0xF2EEE6}));wall.position.set(0,1.2,-1.4);scene.add(wall);

const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.6,metalness:0},o));
const METAL=mat(0xC8CDD3,{metalness:.8,roughness:.3});
const HIT=new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false});
function box(w,h,d,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.castShadow=true;o.receiveShadow=true;return o;}
function cyl(r1,r2,h,m,s=20){const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,s),m);o.castShadow=true;return o;}
function ctex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=renderer.capabilities.getMaxAnisotropy();return {t,c,g};}
function sprite(text,col='#1D2433',bg='rgba(255,255,255,.9)',w=.05){
  const {t}=ctex(256,96,(g)=>{g.fillStyle=bg;g.beginPath();g.roundRect?g.roundRect(4,8,248,80,20):g.rect(4,8,248,80);g.fill();g.fillStyle=col;g.font='bold 52px Sarabun, sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(text,128,50);});
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));s.scale.set(w,w*.375,1);s.renderOrder=5;return s;
}

let root=new THREE.Group();scene.add(root);
let TERM={}, HITS=[], DRAGS=[], LABELS=[], MICRO=null, dyn={}, DEVS=[], DEVG={};
function post(id,parent,x,y,z,col,lab,lw,ly){
  const g=new THREE.Group();g.position.set(x,y,z);parent.add(g);
  const b=cyl(.011,.012,.01,mat(0x222222));b.position.y=.005;g.add(b);
  const cap=cyl(.009,.01,.022,mat(col,{roughness:.4}));cap.position.y=.021;g.add(cap);
  const st=cyl(.003,.003,.012,METAL);st.position.y=.037;g.add(st);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.016,.003,8,24),new THREE.MeshBasicMaterial({color:0xFFD400}));ring.rotation.x=Math.PI/2;ring.position.y=.034;ring.visible=false;g.add(ring);
  const h=new THREE.Mesh(new THREE.SphereGeometry(.026,10,8),HIT);h.position.y=.025;h.userData.term=id;g.add(h);HITS.push(h);
  if(lab){const s=sprite(lab,'#1D2433','rgba(255,255,255,.92)',lw||(lab.length>3?.06:.04));s.position.set(0,ly||.065,0);g.add(s);}
  TERM[id]={id,g,ring,top:()=>g.localToWorld(new THREE.Vector3(0,.04,0))};
  return g;
}
function dlabel(text,obj,dy){LABELS.push({text,obj,dy,el:null});}

/* ---------- devices ---------- */
function scaleTex(){
  return ctex(4096,160,(g,w,h)=>{g.fillStyle='#fff';g.fillRect(0,0,w,h);const x0=48,x1=w-48;
    for(let i=0;i<=1000;i++){const x=x0+(x1-x0)*i/1000;const cm=i%10===0,c5=i%50===0;g.strokeStyle=cm?'#5a2a8a':'#9b6fd0';g.lineWidth=cm?3:1.5;
      const L=c5?70:cm?52:28;g.beginPath();g.moveTo(x,0);g.lineTo(x,L);g.stroke();g.beginPath();g.moveTo(x,h);g.lineTo(x,h-L*.6);g.stroke();
      if(i%100===0){g.fillStyle='#3b1a66';g.font='bold 46px Sarabun, sans-serif';g.textAlign='center';g.fillText(String(i/10),x,118);}
      else if(i%50===0){g.fillStyle='#5a2a8a';g.font='34px Sarabun, sans-serif';g.textAlign='center';g.fillText(String(i/10),x,112);}}
  }).t;
}
function board(z,wireCol,wireR,ids,name){
  const grp=new THREE.Group();root.add(grp);
  const b=box(1.26,.03,.2,mat(0x8A4B22,{roughness:.5}));b.position.set(0,.015,z);grp.add(b);
  const s=new THREE.Mesh(new THREE.PlaneGeometry(1.0+.024,.045),new THREE.MeshStandardMaterial({map:scaleTex(),roughness:.8}));
  s.rotation.x=-Math.PI/2;s.position.set(0,.0312,z+.035);grp.add(s);
  const wr=cyl(wireR,wireR,1.0,mat(wireCol,{metalness:.7,roughness:.35}),10);wr.rotation.z=Math.PI/2;wr.position.set(0,.036,z+.006);grp.add(wr);
  [-1,1].forEach(sg=>{const e=box(.05,.01,.06,METAL);e.position.set(sg*.525,.035,z+.01);grp.add(e);});
  const rail=box(1.08,.01,.018,METAL);rail.position.set(0,.035,z-.055);grp.add(rail);
  const lab=ctex(512,64,(g)=>{g.fillStyle='#fff';g.font='bold 30px Sarabun, sans-serif';g.fillText(name,10,42);}).t;
  const lp=new THREE.Mesh(new THREE.PlaneGeometry(.32,.04),new THREE.MeshBasicMaterial({map:lab,transparent:true}));lp.rotation.x=-Math.PI/2;lp.position.set(.1,.0311,z+.08);grp.add(lp);
  post(ids[0],grp,-.575,.03,z+.006,0x1b1b1b,ids[3]);
  post(ids[1],grp,.575,.03,z+.006,0xC0141E,ids[4]);
  // slider (jockey or clip)
  const j=new THREE.Group();j.position.set(0,.04,z-.055);grp.add(j);
  const body=box(.034,.026,.04,mat(0x2A2F38));body.position.y=.008;j.add(body);
  const arm=box(.008,.006,.068,mat(0x2A2F38));arm.position.set(0,.016,.034);j.add(arm);
  const knife=cyl(.0005,.006,.016,METAL,8);knife.rotation.x=Math.PI;knife.position.set(0,.004,.061);j.add(knife);
  const ptr=box(.0016,.001,.032,mat(0xE0242E));ptr.position.set(0,-.0085,.09);j.add(ptr);
  post(ids[2],j,0,.021,-.004,ids[2]==='D'?0x1b1b1b:0xC0141E,ids[5]);
  const hb=new THREE.Mesh(new THREE.BoxGeometry(.08,.07,.16),HIT);hb.position.set(0,.01,.04);hb.userData.drag=ids[2];j.add(hb);DRAGS.push(hb);
  dlabel(ids[2]==='D'?'จุดสัมผัส D':'คลิป K',j,.07);
  return {grp,slider:j,z};
}
function supply(x,z){
  const g=new THREE.Group();g.position.set(x,0,z);root.add(g);
  const b=box(.2,.13,.24,mat(0xD9DCD5));b.position.y=.065;g.add(b);
  const hd=box(.06,.012,.1,mat(0x555555));hd.position.set(0,.135,-.02);g.add(hd);
  const fc=ctex(512,320,()=>{});const fm=new THREE.Mesh(new THREE.PlaneGeometry(.2,.125),new THREE.MeshStandardMaterial({map:fc.t,roughness:.6}));
  fm.position.set(0,.065,.1205);g.add(fm);
  dyn.sup={fc,last:''};
  [[-.07,.035],[-.035,.035],[.035,.035],[.07,.035]].forEach(([a,b2])=>{const k=cyl(.009,.01,.014,mat(0xD8C08A));k.rotation.x=Math.PI/2;k.position.set(a,b2,.127);g.add(k);});
  post('S-',g,-.03,0,.15,0x1b1b1b,'−');post('S+',g,.04,0,.15,0xC0141E,'+');
  dlabel('แหล่งจ่าย DC',b,.09);return g;
}
function drawSup(){
  const P=S.part,sp=S.sup[P],d=dyn.sup;if(!d)return;
  const r=RES||{};const txt=!sp.on?'':(sp.mode==='V'?fx(r.vout||0,2):fx(r.iout||0,2));
  const key=txt+sp.mode+(r.cc?'c':'')+(sp.on?1:0);if(key===d.last)return;d.last=key;
  const g=d.fc.g;g.fillStyle='#E4E6E0';g.fillRect(0,0,512,320);
  g.fillStyle='#2160B0';g.fillRect(14,12,40,26);g.fillStyle='#fff';g.font='bold 20px sans-serif';g.fillText('GW',18,32);

/* ---------- circuit solver ---------- */
function uf(){const p={};const f=x=>{if(p[x]===undefined)p[x]=x;while(p[x]!==x){p[x]=p[p[x]];x=p[x];}return x;};
  return {f,u:(a,b)=>{a=f(a);b=f(b);if(a!==b)p[a]=b;}};}
function groups(){const U=uf();S.wires[S.part].forEach(w=>U.u(w.a,w.b));return U.f;}
function elements(Vs){
  const E=[],P=S.part,sp=S.sup[P];
  if(sp.on&&Vs>0){E.push(['I','S-','S+',Vs/RS]);E.push(['R','S+','S-',RS]);}
  if(P===0){
    const x=S.jx;E.push(['R','A','#P',RW*x+EA]);E.push(['R','#P','C',RW*(1-x)+EC]);E.push(['R','D','#P',.02]);
    E.push(['R','G1','G2',RG]);E.push(['R','R1a','R1b',S.r1[S.r1i]]);
    S.rx.forEach((r,i)=>E.push(['R','X'+(i+1)+'a','X'+(i+1)+'b',r.t]));
  }else{
    const m=MATS[S.mat],d=S.dt[S.mat+'-'+S.dia]*1e-3,Rt=S.rho[S.mat]/(Math.PI*d*d/4);
    const x=S.kx;E.push(['R','WL','#Q',Rt*x+.003]);E.push(['R','#Q','WR',Rt*(1-x)+.003]);E.push(['R','WK','#Q',.01]);
    AR.forEach(a=>E.push(['R',a.k,'AC',a.r]));
  }
  const mm=S.mm[P];
  if(mm.startsWith('o')){E.push(['I','MC','MV',ITEST]);E.push(['R','MC','MV',1e7]);}
  else if(mm.startsWith('v')){E.push(['R','MC','MV',1e7]);}
  return E;
}
function solve(Vs){
  const f=groups(),E=elements(Vs),idx={},nodes=[];
  const n=k=>{k=k[0]==='#'?k:f(k);if(idx[k]===undefined){idx[k]=nodes.length;nodes.push(k);}return idx[k];};
  E.forEach(e=>{e[1]=n(e[1]);e[2]=n(e[2]);});
  const N=nodes.length,G=Array.from({length:N},()=>new Float64Array(N+1));
  for(let i=0;i<N;i++)G[i][i]+=1e-9;
  E.forEach(([t,a,b,v])=>{if(a===b)return;if(t==='R'){const g=1/v;G[a][a]+=g;G[b][b]+=g;G[a][b]-=g;G[b][a]-=g;}else{G[a][N]-=v;G[b][N]+=v;}});
  for(let c=0;c<N;c++){let p=c;for(let r=c+1;r<N;r++)if(Math.abs(G[r][c])>Math.abs(G[p][c]))p=r;[G[c],G[p]]=[G[p],G[c]];
    const pv=G[c][c];if(Math.abs(pv)<1e-30)continue;for(let r=0;r<N;r++){if(r===c)continue;const k=G[r][c]/pv;if(k)for(let q=c;q<=N;q++)G[r][q]-=k*G[c][q];}}
  const V=new Float64Array(N);for(let i=0;i<N;i++)V[i]=G[i][N]/G[i][i];
  return {v:k=>{k=k[0]==='#'?k:f(k);return idx[k]===undefined?0:V[idx[k]];}};
}
let RES={};
function compute(){
  const P=S.part,sp=S.sup[P];let Vs=sp.V,sol=solve(Vs);
  const iout=s=>sp.on?(Vs/RS-(s.v('S+')-s.v('S-'))/RS):0;
  let I=iout(sol),cc=false;
  if(sp.on&&I>ILIM){Vs=Vs*ILIM/I;sol=solve(Vs);I=iout(sol);cc=true;}
  const r={vout:sp.on?sol.v('S+')-sol.v('S-'):0,iout:I,cc};
  const dv=sol.v('MV')-sol.v('MC');r.mmV=dv;r.mmR=dv/ITEST;
  if(P===0){r.ig=(sol.v('G1')-sol.v('G2'))/RG;r.div=r.ig/GDIV;}
  else{let best=null;AR.forEach(a=>{const i=(sol.v(a.k)-sol.v('AC'))/a.r;if(!best||Math.abs(i)>Math.abs(best.i))best={a,i};});r.amm=best;}

}

  let k=0;if(side){const other=side==='A'?gC:gA;for(let i=1;i<=3;i++)if(pair('X'+i+'a','X'+i+'b',gB,other)){k=i;break;}}
  out.push([k>0,'Rx ต่อระหว่างจุด B กับปลายลวดอีกด้าน']);
  out.push([S.sup[0].on,'เปิดแหล่งจ่าย (ตั้ง 0.5–1.0 V)']);

function diag2(){
  const f=groups(),g=k=>f(k),gL=g('WL'),gR=g('WR'),gK=g('WK'),out=[];
  const used=k=>S.wires[1].some(w=>w.a===k||w.b===k);
  const rng=AR.filter(a=>used(a.k));const ar=rng.length===1?rng[0]:null;
  const ends=[gL,gR],sP=g('S+'),sN=g('S-');
  let series=false;
  if(ar&&used('AC')){const t1=g(ar.k),t2=g('AC');
    for(const [x,y] of [[t1,t2],[t2,t1]])for(const [s1,s2] of [[sP,sN],[sN,sP]])for(const [e1,e2] of [[gL,gR],[gR,gL]])
      if(x===s1&&y===e1&&e2===s2&&used('S+')&&used('S-'))series=true;}
  out.push([series,'แหล่งจ่าย → แอมมิเตอร์ → ลวด (ปลาย 0 ถึง 100 cm) ต่ออนุกรมครบวง']);
  out.push([rng.length===1,'แอมมิเตอร์ใช้ช่องวัด 1 ช่องคู่กับ COM']);
  const mv=g('MV'),mc=g('MC');let l=null;
  if((mv===gL&&mc===gK)||(mv===gK&&mc===gL))l=S.kx*100;else if((mv===gK&&mc===gR)||(mv===gR&&mc===gK))l=(1-S.kx)*100;else if((mv===gL&&mc===gR)||(mv===gR&&mc===gL))l=100;
  out.push([l!==null&&used('MV')&&used('MC'),'มัลติมิเตอร์ (โวลต์) คร่อมลวดช่วงความยาว l']);
  out.push([S.mm[1].startsWith('v'),'หมุนมัลติมิเตอร์ไปโหมด V']);
  out.push([S.sup[1].on,'เปิดแหล่งจ่าย']);
  return {ok:out.every(o=>o[0]),list:out,l};
}

function recBalance(){

function recOhm(){
  compute();if(!S.mm[0].startsWith('o')){toast('หมุนมัลติมิเตอร์ไปโหมด Ω ก่อน');return;}
  const f=groups(),mc=f('MC'),mv=f('MV');let k=0;
  for(let i=1;i<=3;i++){const a=f('X'+i+'a'),b=f('X'+i+'b');if((a===mc&&b===mv)||(a===mv&&b===mc))k=i;}
  if(!k){toast('ต่อสาย COM และ VΩ คร่อม Rx ตัวที่จะวัด');return;}
  const v=mmVal();if(v===null){toast('ค่าเกินช่วงวัด (จอขึ้น 1.) เปลี่ยนช่อง Ω ให้ใหญ่ขึ้น');return;}
  const busy=S.wires[0].filter(w=>[w.a,w.b].some(t=>t==='X'+k+'a'||t==='X'+k+'b')).length>2;
  (S.rec1[k]||(S.rec1[k]={})).m=v;save();dirty();
  toast('บันทึกค่าโอห์มมิเตอร์ Rx'+k+' = '+v+' Ω'+(busy?' (ระวัง: ยังต่ออยู่ในวงจร)':''));
}
function wkey(){return S.mat+'-'+S.dia;}
function recPoint(){
  compute();const d=diag2();if(!d.ok){toast('วงจรยังไม่ครบ กด "ตรวจวงจร" ดูว่าขาดอะไร');showDiag();return;}
  const a=ammRead();if(!a||a.f<=0){toast('เข็มแอมมิเตอร์ตีกลับ (ต่อขั้วสลับ) หรือไม่มีกระแส');return;}
  if(a.f>1.02){toast('เข็มแอมมิเตอร์ตีเกินสเกล เปลี่ยนไปช่องที่ใหญ่ขึ้น');return;}
  if(a.f<.05){toast('เข็มแอมมิเตอร์แทบไม่ขยับ อ่านค่าไม่ได้ ย้ายสายไปช่องที่เล็กลง');return;}
  const lowWarn=a.f<.2;
  const V=mmVal();if(V===null){toast('โวลต์มิเตอร์เกินช่วง เปลี่ยนช่อง V ให้ใหญ่ขึ้น');return;}
  const l=Math.round(d.l*10)/10,I=a.val,R=Math.abs(V)/I;
  const arr=S.rec2[wkey()]||(S.rec2[wkey()]=[]);const j=arr.findIndex(p=>Math.abs(p.l-l)<.05);const p={l,V:Math.abs(V),I,R,rg:a.a.t};
  if(j>=0)arr[j]=p;else arr.push(p);arr.sort((x,y)=>x.l-y.l);save();dirty();
  toast('บันทึก l = '+fx(l,1)+' cm, R = '+fx(R,3)+' Ω'+(lowWarn?' (เข็มขึ้นน้อย ค่าอาจคลาดเคลื่อนมาก ลองช่องที่เล็กลง)':''));
}
function fit(arr){const n=arr.length;if(n<2)return null;let sx=0,sy=0,sxx=0,sxy=0;arr.forEach(p=>{const x=p.l/100;sx+=x;sy+=p.R;sxx+=x*x;sxy+=x*p.R;});
  const den=n*sxx-sx*sx;if(Math.abs(den)<1e-12)return null;const m=(n*sxy-sx*sy)/den,b=(sy-m*sx)/n;return {m,b};}

  else if(k==='r1'){S.r1i=+v;build();}
  else if(k==='mvx'){const to=+v;const d=diag1();const from=[1,2,3].find(i=>S.wires[0].some(w=>[w.a,w.b].some(t=>t==='X'+i+'a'||t==='X'+i+'b')));

  else if(k==='swap'){const from=[1,2,3].find(i=>S.wires[0].some(w=>[w.a,w.b].some(t=>t==='X'+i+'a'||t==='X'+i+'b')));
    if(!from){toast('ต่อ Rx ในวงจรก่อน');}else{const m={R1a:'X'+from+'a',R1b:'X'+from+'b'};m['X'+from+'a']='R1a';m['X'+from+'b']='R1b';
      S.wires[0].forEach(w=>{if(w.a.startsWith('M')||w.b.startsWith('M'))return;['a','b'].forEach(e=>{if(m[w[e]])w[e]=m[w[e]];});});toast('สลับตำแหน่ง R₁ กับ Rx'+from+' แล้ว หาจุดสมดุลใหม่');}}

  else if(k==='clr1'){S.rec1={};}else if(k==='newrx'){const f=fresh();S.rx=f.rx;S.rec1={};build();toast('สุ่ม Rx ชุดใหม่แล้ว');}
  else if(k==='clr2'){delete S.rec2[wkey()];}else if(k==='dp'){(S.rec2[wkey()]||[]).splice(+v,1);}
  else if(k==='mat'){S.mat=+v;build();}else if(k==='dia'){S.dia=+v;build();}
  else if(k==='rg'){let n=0;S.wires[1].forEach(w=>['a','b'].forEach(e=>{if(AR.some(a=>a.k===w[e])){w[e]=v;n++;}}));toast(n?'ย้ายสายไปช่อง '+AR.find(a=>a.k===v).t:'ยังไม่ได้ต่อสายที่แอมมิเตอร์');}
  else if(k==='micro')openMicro();

  else if(k==='clear'){S.wires[P]=[];selWire=-1;wireMeshes.forEach(w=>scene.remove(w.m));wireMeshes=[];}
  else if(k==='auto'){autoWire();}

    const end=tgt?TERM[tgt].top():(ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),-.06),p)?p:null);
    if(end)drawTmp(TERM[wdrag.from].top(),end.clone());return;}
  if(ddrag){ndc(e);if(Math.hypot(e.clientX-ddrag.x,e.clientY-ddrag.yy)>6)ddrag.moved=true;if(S.lock||!ddrag.moved)return;const p=new THREE.Vector3();
    if(ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),-ddrag.y),p)){const D=DEVG[ddrag.id];const np=p.add(ddrag.off);
      const cx=Math.max(-.9,Math.min(.9,np.x+D.c[0])),cz=Math.max(-.55,Math.min(.62,np.z+D.c[2]));D.g.position.x=cx-D.c[0];D.g.position.z=cz-D.c[2];}return;}
  if(!drag)return;ndc(e);const pl=new THREE.Plane(new THREE.Vector3(0,1,0),-.05);const p=new THREE.Vector3();
  if(ray.ray.intersectPlane(pl,p)){const x=Math.max(0,Math.min(1,Math.round((p.x+.5)*1000)/1000));if(S.part===0)S.jx=x;else S.kx=x;placeSlider();}},{capture:true});
function endDrag(){if(drag){drag=null;save();}if(tmpW){scene.remove(tmpW);tmpW.geometry.dispose();tmpW=null;}setHover(null);
  if(wdrag){if(wdrag.from!==sel&&TERM[wdrag.from])TERM[wdrag.from].ring.visible=false;wdrag=null;}ddrag=null;controls.enabled=true;}
canvas.addEventListener('pointerup',e=>{
  if(wdrag){const w=wdrag,r=ndc(e);const tgt=w.moved?termAt(e,r,w.from,40):null;endDrag();
    if(!w.moved)tapTerm(w.from);else if(tgt){setSel(null);addWire(w.from,tgt);}else toast('ปล่อยสายให้ตรงขั้วปลายทาง');return;}
  if(ddrag){const d=ddrag;endDrag();if(d.moved&&!S.lock){const g=DEVG[d.id].g;S.dpos[S.part][d.id]=[+g.position.x.toFixed(3),+g.position.z.toFixed(3)];save();}
    else if(!d.moved){if(d.id==='mic'){openMicro();return;}if(S.lock&&d.moved)return;const r=ndc(e);const wm=ray.intersectObjects(wireMeshes.map(w=>w.m),false)[0];if(wm){selWire=wm.object.userData.wire===selWire?-1:wm.object.userData.wire;renderPanel();}else if(sel)setSel(null);}
    else toast('อุปกรณ์ถูกล็อกอยู่ ปลดล็อกในแผง "ต่อสาย"');return;}
  if(drag){endDrag();return;}
  if(!down)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);const dt=performance.now()-down.t;down=null;if(moved>8||dt>600)return;
  const r=ndc(e);
  const wm=ray.intersectObjects(wireMeshes.map(w=>w.m),false)[0];if(wm){selWire=wm.object.userData.wire===selWire?-1:wm.object.userData.wire;renderPanel();if(selWire>=0)toast('เลือกสาย '+(selWire+1)+' — กด ✕ ในรายการเพื่อลบ');return;}
  if(MICRO&&ray.intersectObject(MICRO,false)[0]){openMicro();return;}
  if(sel){setSel(null);}
},{capture:true});
canvas.addEventListener('pointercancel',endDrag);
function setSel(id){if(sel&&TERM[sel])TERM[sel].ring.visible=false;sel=id;if(id&&TERM[id])TERM[id].ring.visible=true;
  const tip=$('#selTip');if(id){tip.style.display='block';tip.textContent='เลือก '+TN[id]+' → แตะอีกขั้ว (หรือลากจากขั้ว) เพื่อต่อสาย';}else tip.style.display='none';}
function tapTerm(id){if(!sel){setSel(id);return;}if(sel===id){setSel(null);return;}const a=sel;setSel(null);addWire(a,id);}

/* ---------- labels / readout ---------- */
function updLabels(){
  const W=view.clientWidth,H=view.clientHeight,box=$('#labels');
  LABELS.forEach(l=>{if(!l.el){l.el=document.createElement('div');l.el.className='dl';l.el.textContent=l.text;box.appendChild(l.el);}
    const p=new THREE.Vector3();l.obj.getWorldPosition(p);p.y+=l.dy;p.project(camera);const vis=p.z<1&&p.x>-1.1&&p.x<1.1&&p.y>-1.1&&p.y<1.1;
    l.el.style.display=vis?'block':'none';l.el.style.left=((p.x+1)/2*W)+'px';l.el.style.top=((1-p.y)/2*H)+'px';});
}
function setT(id,t){const e=document.getElementById(id);if(e&&e.textContent!==t)e.textContent=t;}
function setH(id,t){const e=document.getElementById(id);if(e&&e.innerHTML!==t)e.innerHTML=t;}
function updReadout(){
  const P=S.part,r=RES,sp=S.sup[P];const pos=(P===0?S.jx:S.kx)*100;
  setT('posRead',fx(pos,1)+' cm');setT('mmRead',S.mm[P]==='off'?'ปิด':mmText()+' '+(S.mm[P].startsWith('o')?(S.mm[P]==='o20k'?'kΩ':'Ω'):(S.mm[P]==='v200m'?'mV':'V')));
  let h=`แหล่งจ่าย: <b>${sp.on?fx(r.vout,2)+' V · '+fx(r.iout,2)+' A':'ปิด'}</b>${r.cc&&sp.on?' <span style="color:#C0392B">C.C.</span>':''}<br>`;
  if(P===0){const dv=r.div||0;const t=Math.abs(dv)>30?(dv>0?'+30 ตีสุด!':'−30 ตีสุด!'):(dv>0?'+':'')+fx(dv,1);setT('gRead',t+' ช่อง');
    h+=`D: <b>${fx(pos,1)} cm</b> · G: <b>${t}</b>`;}
  else{const a=ammRead();let at='–';if(a){if(a.f>1.02)at='ตีเกินสเกล!';else if(a.f<-.02)at='ตีกลับ!';else at=(a.q*a.a.sc).toFixed(a.a.sc>=10?0:2)+' '+(a.a.u)+(a.a.sc===100||a.a.sc===10||a.a.sc===2?'':'');}
    const used=AR.filter(x=>S.wires[1].some(w=>w.a===x.k||w.b===x.k)).map(x=>x.t).join(', ')||'ยังไม่ต่อ';
    if(a){const v=a.a.sc*Math.max(-.02,Math.min(1.02,a.f));at=a.f>1.02?'ตีเกินสเกล!':a.f<-.02?'ตีกลับ!':(Math.round(a.f*100)/100*a.a.sc).toFixed(a.a.sc>=10?1:3)+' '+a.a.u;}
    setT('ammRead',at);setT('ammRg',used);h+=`K: <b>${fx(pos,1)} cm</b> · A: <b>${at}</b>`;}
  if(S.mm[P]!=='off')h+=`<br>มัลติมิเตอร์: <b>${mmText()}</b>`;
  setH('readout',h);
}
function updNeedles(dt){
  if(dyn.G){const dv=RES.div||0;const tgt=Math.max(-1.08,Math.min(1.08,dv/30))*.84;dyn.G.ang+=(tgt-dyn.G.ang)*Math.min(1,dt*8);dyn.G.piv.rotation.z=-dyn.G.ang;}
  if(dyn.A){const a=RES.amm;let f=a?a.i/a.a.fs:0;f=Math.max(-.04,Math.min(1.06,f));const tgt=(f-.5)*2*.84;dyn.A.ang+=(tgt-dyn.A.ang)*Math.min(1,dt*8);dyn.A.piv.rotation.z=-dyn.A.ang;}
}

/* ---------- loop ---------- */
function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',()=>{resize();setCam(S.cam[S.part],true);});
let last=performance.now(),warnT=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(camAnim){camAnim.s=Math.min(1,camAnim.s+dt*2.5);const e=camAnim.s<.5?2*camAnim.s*camAnim.s:1-Math.pow(-2*camAnim.s+2,2)/2;
    camera.position.lerpVectors(camAnim.p0,camAnim.p1,e);controls.target.lerpVectors(camAnim.t0,camAnim.t1,e);if(camAnim.s>=1)camAnim=null;}
  placeSlider();controls.update();scene.updateMatrixWorld();syncWires();compute();drawSup();drawMM();updNeedles(dt);updLabels();updReadout();
  renderer.render(scene,camera);requestAnimationFrame(loop);
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{S.part=+t.dataset.p;setSel(null);selWire=-1;save();build();renderPanel(true);}));
$('#panel').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)act(b.dataset.act);});
let tT=0;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2600);}
window.LAB={devScr:id=>{const D=DEVG[id];const r=canvas.getBoundingClientRect();const v=new THREE.Vector3(...D.c);D.g.localToWorld(v);const q=v.project(camera);return [r.left+(q.x+1)/2*r.width,r.top+(1-q.y)/2*r.height];},scr:id=>{const r=canvas.getBoundingClientRect();const q=TERM[id].top().project(camera);return [r.left+(q.x+1)/2*r.width,r.top+(1-q.y)/2*r.height];},S,act,compute:()=>{compute();return RES;},diag1,diag2,setCam,tapTerm};
resize();build();renderPanel(true);requestAnimationFrame(loop);
</script>
</body>
