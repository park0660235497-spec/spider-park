<title>ParK_iLab ความร้อนและแก๊ส</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Anuphan:wght@400;500;600&display=swap">
<style>
/* Layout: step rail on the left (top bar on phones) + one working view; the lab view is a 3D bench beside a control panel.
   Single bright pastel look by choice, so every color is set explicitly. */
:root{
  color-scheme: light;
  --bg:#F6F7FB; --surface:#FFFFFF; --soft:#F1F4FD; --stage:#EDF1FA;
  --ink:#1E2340; --ink2:#3D4466; --muted:#5B6280; --line:#E6E9F2; --line2:#E1E5F0;
  --primary:#3B6FD8; --primary-d:#2A54AE; --primary-soft:#EAF0FE;
  --atom:#FFC94D; --atom-soft:#FFF4D6; --mint:#5CCFA4; --ok:#1F8A63; --ok-soft:#DDF5EA;
  --pink:#FF8FB1; --red:#E25555; --red-soft:#FDE8E8; --lock:#7A809A; --lock-bg:#EEF0F6;
  --f-display:'Mitr', 'Noto Sans Thai', sans-serif;
  --f-body:'Anuphan', 'Noto Sans Thai', 'Leelawadee UI', sans-serif;
  --r-lg:24px; --r-md:16px; --r-sm:12px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;line-height:1.3}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

.app{display:flex;min-height:100%}
.rail{flex:0 0 268px;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;border:0;background:none;cursor:pointer;text-align:left}
.brand b{font-family:var(--f-display);font-size:21px;font-weight:600}
.brand b span{color:var(--primary)}
.credit{font-size:12.5px;font-weight:600;color:var(--primary-d);letter-spacing:.2px}
.steps{display:flex;flex-direction:column;gap:4px}
.steps-label{font-size:13px;color:var(--muted);padding:0 12px 6px}
.step{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 12px;border:0;border-radius:14px;background:transparent;text-align:left;cursor:pointer}
.step:hover:not(:disabled){background:var(--soft)}
.step:disabled{cursor:not-allowed;color:var(--lock)}
.step.current{background:var(--primary-soft)}
.step .dot{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--lock-bg);color:var(--lock);font-weight:600;font-size:14px}
.step.current .dot{background:var(--primary);color:#fff}
.step.done .dot{background:var(--ok-soft);color:var(--ok)}
.step .lbl{flex:1;font-size:15px;font-weight:500}
.progress{margin-top:auto;padding:16px;border-radius:var(--r-md);background:var(--soft);display:flex;flex-direction:column;gap:8px}
.bar{height:10px;border-radius:99px;background:#DDE3F3;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .4s ease}
.linkbtn{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer;padding:4px 0;text-align:left}

main{flex:1;min-width:0;padding:28px 36px 48px}
.wrap{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.wrap.wide{max-width:1320px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{padding:4px 12px;border-radius:99px;font-size:13px;font-weight:600}
.tag.y{background:var(--atom-soft);color:#7A5A00}.tag.g{background:var(--ok-soft);color:#1D6B4F}.tag.b{background:var(--primary-soft);color:var(--primary-d)}
.h1{font-size:clamp(28px,4vw,40px);font-weight:600}
.sub{color:var(--muted);margin:0;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.pad{padding:24px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border:0;border-radius:var(--r-md);background:var(--primary);color:#fff;font-family:var(--f-display);font-size:17px;font-weight:500;box-shadow:0 4px 0 var(--primary-d);cursor:pointer;transition:transform .12s ease}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:0 2px 0 var(--primary-d)}
.btn:disabled{background:#AEB9D6;box-shadow:none;cursor:not-allowed}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 #166B4C}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line2);box-shadow:none;font-family:var(--f-body);font-size:16px}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{min-height:44px;padding:0 16px;font-size:15px}
.ibtn{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--surface);cursor:pointer}
.ibtn:hover{background:var(--soft)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.spread{justify-content:space-between}

.mascot-row{display:flex;flex-wrap:wrap;align-items:center;gap:20px}
.mascot-row .say{flex:1 1 280px;display:flex;flex-direction:column;gap:4px}
.say b{font-family:var(--f-display);font-weight:500;font-size:20px}
.say span{color:var(--ink2)}

.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.part{display:flex;flex-direction:column;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);overflow:hidden;text-align:left;padding:0;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.part:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 14px 30px rgba(30,35,64,.10)}
.part:disabled{cursor:not-allowed}
.part .art{height:140px;display:grid;place-items:center}
.part .body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
.part .k{font-size:13px;font-weight:600;color:var(--muted)}
.part h3{font-size:19px}
.part p{margin:0;font-size:15px;color:var(--muted);flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;background:var(--lock-bg);color:var(--muted);align-self:flex-start;margin-top:6px}
.pill.go{background:var(--primary-soft);color:var(--primary-d)}
.pill.done{background:var(--ok-soft);color:var(--ok)}

/* quiz */
.qhead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.qdots{display:flex;gap:6px;flex-wrap:wrap}
.qdot{width:28px;height:28px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;padding:0}
.qdot.ans{background:#CFE0FB;border-color:#CFE0FB;color:var(--primary-d)}
.qdot.cur{outline:2px solid var(--primary);outline-offset:1px}
.qtext{font-size:clamp(20px,2.6vw,25px);line-height:1.5}
.qfig{display:flex;justify-content:center;background:var(--soft);border-radius:var(--r-md);padding:12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:72px;padding:16px 14px 16px 54px;border-radius:20px;border:3px solid var(--line);background:#FAFBFE;cursor:pointer;text-align:left;transition:transform .12s ease}
.opt.pic{padding:46px 12px 14px;text-align:center}
.opt:hover{transform:translateY(-2px)}
.opt .badge{position:absolute;top:12px;left:12px;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;font-family:var(--f-display);background:var(--surface);border:1px solid var(--line2);color:var(--ink2)}
.opt[aria-checked="true"]{border-color:var(--primary);background:var(--primary-soft)}
.opt[aria-checked="true"] .badge{background:var(--primary);border-color:var(--primary);color:#fff}
.opt .t{font-size:16px;font-weight:500;width:100%}

/* lab */
.labgrid{display:flex;flex-wrap:wrap;gap:16px;align-items:stretch}
.stage{flex:999 1 560px;min-width:0;position:relative;height:clamp(360px,64vh,660px);border-radius:var(--r-lg);background:var(--stage);border:1px solid var(--line2);overflow:hidden;touch-action:none}
.stage canvas{display:block;width:100%!important;height:100%!important;cursor:grab}
.stage canvas.dragging{cursor:grabbing}
.stage .hint{position:absolute;top:14px;left:14px;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.92);font-size:13px;font-weight:500;color:var(--ink2);pointer-events:none;max-width:calc(100% - 90px)}
@media (max-width:600px){.stage .hint{font-size:11px;padding:5px 10px;top:8px;left:8px;line-height:1.35;max-width:calc(100% - 70px)}}
.camctl{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:8px;z-index:3}
.labels{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.labels div{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:3px 10px;border-radius:99px;background:rgba(30,35,64,.78);color:#fff;font-size:12px;font-weight:600;white-space:nowrap}
.warn{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:4;padding:8px 16px;border-radius:99px;background:var(--red);color:#fff;font-weight:600;font-size:14px;max-width:calc(100% - 100px);text-align:center;pointer-events:none}
.bubble{position:absolute;left:12px;bottom:12px;right:12px;display:flex;align-items:flex-end;gap:8px;z-index:3;pointer-events:none}
.bubble .msg{max-width:380px;padding:10px 14px;border-radius:18px 18px 18px 4px;background:var(--surface);box-shadow:0 6px 18px rgba(30,35,64,.10);font-size:15px;line-height:1.5}
.labgrid .pdwrap{flex:999 1 480px;min-width:0;display:flex;flex-direction:column}
.pdwrap .stage{flex:none;width:100%;border-radius:var(--r-lg) var(--r-lg) 0 0;border-bottom:0;height:clamp(340px,58vh,640px)}
.pdbar{background:var(--surface);border:1px solid var(--line2);border-top:2px solid var(--line2);border-radius:0 0 var(--r-lg) var(--r-lg);padding:8px 10px}
.pdbar .pdock{padding:0;border:0;background:none;border-radius:0;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:6px 8px}
.pdbar .pdock:empty{display:none}
.pdbar .pdock h2{font-size:13px;font-weight:600;color:var(--primary-d);margin:0 2px 0 4px;flex:none}
.pdbar .pdock .ctl{min-height:48px;gap:8px;background:#F3F5FB;border-radius:12px;padding:3px 4px 3px 12px;flex:none}
.pdbar .pdock .ctl .n{font-size:15px;font-weight:600;color:var(--ink)}
.pdbar .pdock .btn{min-height:48px;font-size:15.5px;padding:0 16px;border-radius:12px}
.pdbar .pdock .ibtn{width:48px;height:48px;font-size:22px}
.pdbar .pdock .seg button{min-height:46px;font-size:15.5px;padding:0 14px}
.pdbar .pdock .row{gap:6px!important;flex:0 1 auto;max-width:100%;flex-wrap:wrap}
.pdbar .pdock .note{font-size:12.5px;flex-basis:100%}
.stage .pres{position:absolute;top:66px;left:12px;z-index:3;width:min(210px,40%);padding:7px 10px;border-radius:14px;background:rgba(255,255,255,.94);box-shadow:0 4px 14px rgba(30,35,64,.12);gap:6px;font-size:12.5px;max-height:calc(100% - 190px);overflow:auto}
.stage .pres:empty{display:none}
.stage .pres.md{top:62px;left:auto;right:66px;width:min(360px,46%);max-height:calc(100% - 140px);font-size:13px;padding:9px 12px}
.stage .pres.md h2{font-size:15px}
.stage .pres.md canvas{max-height:170px;object-fit:contain}
.stage.full .pres.md{width:min(420px,40%);max-height:calc(100% - 90px)}
.stage.full .pres.md canvas{max-height:240px}
.stage .pres.md.c.shut{display:none!important}
.stage .pres.md.c h2::after{content:'✕';font-size:14px}
.reschip{position:absolute;top:10px;right:66px;z-index:5;width:max-content;max-width:42%;display:flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border-radius:12px;background:rgba(255,255,255,.96);box-shadow:0 4px 14px rgba(30,35,64,.12);font-size:14px;min-height:44px;box-sizing:border-box}
.reschip[hidden]{display:none!important}
.stage[data-mdc] .pres.md{top:var(--docky,62px)}
.stage[data-mdc] #dock{right:calc(var(--chipw,0px) + 74px)!important}
.reschip .v{color:#2E6BE6;font-weight:700}
.reschip .btn{min-height:34px;padding:0 10px;flex:0 0 auto}
.reschip b{display:none}
.stage .pres h2{font-size:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}
.stage .pres h2::after{content:'▾';font-size:12px;color:var(--muted)}
.stage .pres.mini h2::after{content:'▸'}
.stage .pres.mini>:not(h2){display:none!important}
.stage .pres .note{font-size:12px}
.stage .pres [style*="font-size:3"],.stage .pres [style*="font-size:4"]{font-size:26px!important}
.stage .pres .stat b,.stage .pres .big{font-size:26px}
#resPop{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);z-index:6;display:none;align-items:center;gap:10px;padding:12px 20px;border-radius:18px;background:rgba(255,255,255,.97);box-shadow:0 10px 30px rgba(30,35,64,.22);font-size:18px;font-weight:600;pointer-events:none;white-space:nowrap}
#resPop.show{display:flex;animation:rp 2.4s ease forwards}
#resPop .status{font-size:20px;padding:4px 14px}
@keyframes rp{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
.pres.pop{animation:presPop .9s ease}
@keyframes pop{0%{transform:scale(1)}25%{transform:scale(1.45);box-shadow:0 0 0 6px rgba(255,196,0,.45)}100%{transform:scale(1)}}
@keyframes presPop{0%{box-shadow:0 0 0 0 rgba(255,196,0,.0)}30%{box-shadow:0 0 0 6px rgba(255,196,0,.6)}100%{box-shadow:0 4px 14px rgba(30,35,64,.12)}}
.pdwrap.full{position:fixed;inset:0;z-index:900;background:var(--surface)}
.pdwrap.full .stage{flex:1 1 auto;height:auto!important;border-radius:0}
.pdwrap.full .pdbar{border-radius:0;border-left:0;border-right:0;border-bottom:0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.stage.full{position:fixed!important;inset:0;width:100vw;height:100vh!important;height:100dvh!important;max-width:none;border-radius:0;z-index:900;border:0}
body.fullon{overflow:hidden}
.ginfo .gsec{box-shadow:none;border:1px solid var(--line);margin-bottom:10px}
.ginfo .gsec h2{font-size:17px}
.eqlock{padding:12px;border-radius:14px;background:var(--lock-bg);color:var(--ink2);font-size:14px}
.eq{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:#F6F8FD;border:1px solid var(--line)}
.eq.ok{background:#EFFAF4;border-color:#BFE6D0}
.eqq{font-weight:600;font-size:15.5px;line-height:1.45}
.eqo{display:flex;flex-direction:column;gap:6px}
.eqb{min-height:48px;text-align:left;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line2);background:var(--surface);font:inherit;font-size:15px;color:var(--ink);cursor:pointer}
.eqb:hover{border-color:var(--primary)}
.eqb.bad{border-color:var(--red);background:#FDECEC;color:#9B2C2C}
.eqok{font-weight:600;color:#1D6B4F}
.eqwhy{font-size:13.5px;color:var(--ink2);line-height:1.5}
.eqstep{font-size:13.5px;font-weight:600;color:var(--primary-d)}
.eqh{font-size:13.5px;background:#FFF7E0;border-radius:10px;padding:8px 10px;line-height:1.5}
.tsheet{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:10px 14px;border-radius:14px;border:1.5px dashed var(--line2);background:transparent;font:inherit;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;text-align:left}
.tsheet[hidden]{display:none!important}
.tsheet span{font-size:12px;font-weight:400;color:var(--muted)}
.tsheet:hover{border-color:var(--primary);color:var(--primary-d)}
@media (max-width:860px){.tsheet{width:auto;flex-direction:row;align-items:center;gap:8px;padding:6px 12px;align-self:flex-start}}
.panel{flex:1 1 280px;max-width:340px;min-width:0;display:flex;flex-direction:column;gap:14px}
.box{padding:18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.box h2{font-size:18px}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.ctl .n{font-size:15px;color:var(--ink2)}
.toggle{position:relative;flex:none;width:64px;height:36px;border:0;border-radius:99px;background:#C9CFDF;cursor:pointer;transition:background .2s}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.15);transition:left .2s}
.toggle[aria-checked="true"]{background:#2FA57A}
.toggle[aria-checked="true"]::after{left:32px}
.toggle:disabled{opacity:.45;cursor:not-allowed}
.seg{display:flex;padding:4px;border-radius:14px;background:var(--lock-bg);gap:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:10px;background:transparent;font-weight:600;font-size:15px;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--primary-d);box-shadow:0 2px 6px rgba(30,35,64,.08)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .v{min-width:70px;text-align:center;font-family:var(--f-display);font-size:24px;font-weight:500}
.stepper .v small{font-size:14px;color:var(--muted);font-family:var(--f-body)}
.meter{display:flex;flex-direction:column;gap:6px}
.meter .top{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.meter .top b{color:var(--ink)}
.meter .bar>i{background:var(--atom)}
.status{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:14px;font-weight:600}
.status.on{background:var(--ok-soft);color:var(--ok)}.status.off{background:var(--red-soft);color:#B13A3A}
.miss{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.miss li{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--ink2)}
.miss .c{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line2);display:grid;place-items:center;margin-top:1px}
.miss li.done{color:var(--ink)}
.miss li.done .c{background:var(--ok);border-color:var(--ok)}
.overlay{position:absolute;inset:0;background:rgba(237,241,250,.82);display:grid;place-items:center;z-index:5;padding:16px}
.overlay .card{max-width:520px;width:100%;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 40px rgba(30,35,64,.12)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:44px;padding:0 16px;border-radius:14px;border:2px solid var(--line2);background:var(--surface);font-weight:600;font-size:15px;cursor:pointer;color:var(--ink2)}
.chip:hover{border-color:var(--primary)}
.chip[aria-checked="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-d)}

/* guide + sheet */
.gsec{display:flex;flex-direction:column;gap:10px}
.gsec h2{font-size:21px}
.gsec ol,.gsec ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;max-width:68ch}
.poe{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.poe div{padding:16px;border-radius:var(--r-md);background:var(--soft);display:flex;flex-direction:column;gap:4px}

const MOOD = {happy:'wink', think:'smug', wow:'sparkle', yay:'cheer', ok:'wave', plead:'confused', shock:'sweat', cry:'cry', work:'smug', cheer:'cheer', cool:'cool', wink:'wink', smug:'smug', confused:'confused', angry:'angry', shy:'shy', sleepy:'sleepy', sparkle:'sparkle', sweat:'sweat', speechless:'speechless', love:'love', tired:'tired', bigshock:'shock', wave:'wave'};
function mascot(mood='happy', size=88){
  const k = MOOD[mood] || 'wink';
  return `<img src="${PARTY_IMG[k]}" width="${size}" height="${size}" alt="" class="pty" style="flex:none;width:${size}px;height:${size}px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(30,35,64,.18))">`;
}
function moodOf(mood, msg){
  if(/ลัดวงจร/.test(msg)) return 'bigshock';
  if(/ถูก \d+ จาก/.test(msg)) return 'confused';
  if(/ผิดถาด|วางผิด|คิดใหม่|ยังไม่ถูก|ถูก \d+ จาก/.test(msg)) return 'shock';
  return mood;
}

 [{k:'K', q:'ความดันของแก๊สแปรผันตรงกับอุณหภูมิในหน่วยใด', o:[['K','เคลวิน'],['C','องศาเซลเซียส'],['none','ไม่ขึ้นกับอุณหภูมิ']], a:'K',

];

const PD = !CONF.uni && /ป\.\d|ม\.1(?!\d)/.test(CONF.subject || ''), NOG = CONF.uni || PD, MD = !!CONF.uni && !!CONF.resCard, MDC = CONF.resCard==='C';
const STEPS = ['แบบทดสอบก่อนเรียน','คู่มือการทำกิจกรรม','ตัวแลป', CONF.uni ? 'สรุปและทบทวน' : 'ใบกิจกรรมบันทึกผล','แบบทดสอบหลังเรียน'];
const STEP_VIEW = ['pre','guide','picker','sheet','post'];

/* ---------- state (kept in this browser only) ---------- */
const KEY = CONF.key;
const NQ = QUIZ.length, SR = !!CONF.senior, HS = !!CONF.hs;
const fresh = () => ({
  qv:2, pre:{a:Array(NQ).fill(null), done:false, score:null},
  guideRead:false, labDone:PARTS.map(()=>false), pred:PARTS.map(()=>null),
  nick:'', miss:Object.fromEntries(PARTS.map((_,i)=>[i,{}])), sheet:{}, sheetDone:false,
  post:{a:Array(NQ).fill(null), done:false, score:null}
});
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch(e){ S = fresh(); }
const QV0 = S && S.qv; S = Object.assign(fresh(), S);
/* repair answer arrays (a fast double tap once wrote past the last question) */
['pre','post'].forEach(k=>{ const a = (S[k] && Array.isArray(S[k].a)) ? S[k].a : []; S[k].a = Array.from({length:NQ}, (_,i)=>a[i]==null ? null : a[i]); });
/* balanced, stable option order: the correct choice lands on ก ข ค ง equally often (same order for every learner) */
(function(){ let h = 2166136261; for(const ch of String(CONF.key)){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  const rnd = () => { h = (Math.imul(h ^ (h >>> 15), 2246822507) + 0x9E3779B9) >>> 0; return h/4294967296; };
  const sh = arr => { for(let i=arr.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [arr[i],arr[j]] = [arr[j],arr[i]]; } return arr; };
  let block = []; const inv = [];
  QUIZ.forEach((it,qi)=>{ const n = (it.o || it.labels || []).length; if(n!==4){ inv.push(null); return; } if(!block.length) block = sh([0,1,2,3]);
    const pos = block.pop(), others = sh([0,1,2,3].filter(j=>j!==it.a)), perm = []; let k = 0; for(let p=0;p<4;p++) perm.push(p===pos ? it.a : others[k++]);
    ['o','pics','labels'].forEach(f=>{ if(Array.isArray(it[f])) it[f] = perm.map(j=>it[f][j]); }); it.a = pos; inv.push(perm); });
  if(QV0!==2){ ['pre','post'].forEach(k=>{ S[k].a = S[k].a.map((x,i)=>x==null || !inv[i] ? x : inv[i].indexOf(x)); }); S.qv = 2; }
})();
let saveT;
function save(){ clearTimeout(saveT); saveT = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }, 150); }

const ui = { noLabels:false, view:'home', q:0, part:0, preSent:false, confirmReset:false };

const RV = !!CONF.review;
const PRE_OK = () => S.pre.done || !!S.pre.skip, POST_ST = () => S.post.done || S.post.a.some(x=>x!=null);
const PRE_LOCK = () => !S.pre.done && POST_ST();
const GR = () => NOG ? PRE_OK() : S.guideRead;
const unlocked = i => RV || [!PRE_LOCK(), PRE_OK(), GR(), CONF.uni ? S.labDone.every(Boolean) : true, CONF.uni ? revDone() : S.labDone.every(Boolean)][i];
const HIDE = i => (NOG && i===1) || (PD && i===3);
const doneStep = i => [PRE_OK(), GR(), S.labDone.every(Boolean), CONF.uni ? revDone() : (PD || S.sheetDone), S.post.done][i];
const partOpen = i => RV || GR();
const curStep = () => { for(let i=0;i<5;i++){ if(!doneStep(i)) return i; } return 4; };

function toast(msg){ msg = String(msg).replace(/ปลดล็อก(ตอนที่ ?\d+)/, 'ไป$1ต่อได้เลย'); if(/ทดลองครบทุกตอนแล้ว/.test(msg) && S.labDone && !S.labDone.every(Boolean)){ const left = PARTS.map((p,i)=>S.labDone[i] ? '' : p.k).filter(Boolean); msg = 'ตอนนี้เสร็จแล้ว! เหลือ ' + left.join(', '); } else if(/ต่อได้เลย$/.test(msg) && S.labDone && S.labDone.every(Boolean)) msg = CONF.uni ? 'ทดลองครบทุกตอนแล้ว! ไปสรุปและทบทวนต่อได้เลย' : 'ทดลองครบทุกตอนแล้ว! ไปทำแบบทดสอบหลังเรียนได้เลย';
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(()=>{ t.hidden = true; }, 2600);
}
const nk = msg => S.nick ? `${S.nick} ${msg}` : msg;
function showNick(force){
  const m = $('#nickModal'); if(S.nick && !force){ m.hidden = true; return; }
  m.hidden = false;
  m.innerHTML = `<div class="card pad" role="dialog" aria-modal="true" aria-labelledby="nickH" style="max-width:480px;width:100%;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 40px rgba(30,35,64,.12)">
    <div class="row" style="gap:14px;flex-wrap:nowrap">${mascot('ok',96)}<div><h2 id="nickH" style="font-size:22px">${HS ? 'สวัสดีครับ ผมชื่อ "ปาร์ตี้"' : SR ? 'สวัสดีครับ พี่ชื่อ "ปาร์ตี้"' : 'สวัสดี! เราชื่อ "ปาร์ตี้"'}</h2><div class="note">${HS ? 'ผมจะช่วยดูแลการทดลองในแล็บนี้ พิมพ์ชื่อที่อยากให้ผมเรียกไว้ได้เลยครับ' : SR ? 'พี่จะเป็นพี่เลี้ยงในแลปนี้ บอกชื่อเล่นของน้องไว้ พี่จะได้เรียกถูก' : 'แล้วเพื่อนชื่อะไร? บอกชื่อเล่นหน่อย เราจะได้ทดลองด้วยกัน'.replace('ชื่อะไร','ชื่ออะไร')}</div></div></div>
    <label for="nickIn" style="font-weight:600">ชื่อเล่นของฉัน</label>
    <input id="nickIn" type="text" maxlength="20" autocomplete="off" value="${esc(S.nick||'')}" placeholder="พิมพ์ชื่อเล่นตรงนี้">
    <div class="row" style="justify-content:flex-end;gap:8px">${S.nick?'<button class="btn ghost" type="button" id="nickCancel">ยกเลิก</button>':''}<button class="btn" type="button" id="nickGo">${S.nick?'บันทึกชื่อ':'เริ่มกันเลย'} ${ICON.arrow}</button></div></div>`;
  const inp = $('#nickIn');
  const ok = ()=>{ const v = inp.value.trim().slice(0,20); if(!v){ inp.focus(); toast('พิมพ์ชื่อเล่นก่อนนะ'); return; } S.nick = v; save(); m.hidden = true; render(); toast(`ยินดีที่ได้รู้จัก ${v}!`); };
  $('#nickGo').addEventListener('click', ok); inp.addEventListener('keydown', e=>{ if(e.key==='Enter') ok(); });
  const c = $('#nickCancel'); if(c) c.addEventListener('click', ()=>{ m.hidden = true; });
  setTimeout(()=>inp.focus(), 60);
}

/* ---------- rail ---------- */
function renderRail(){
  $('#brandMascot').innerHTML = mascot('wink', 44);
  const nb = $('#nickBar'); nb.hidden = !S.nick; nb.innerHTML = S.nick ? `<span>สวัสดี <b>${esc(S.nick)}</b></span><button class="linkbtn" type="button" data-nick="1">เปลี่ยนชื่อ</button>` : '';
  const viewStep = {pre:0, guide:1, picker:2, lab:2, sheet:3, post:4, result:4}[ui.view];
  $('#steps').innerHTML = `<div class="steps-label">ขั้นตอน</div>` + STEPS.map((l,i)=>{
    if(HIDE(i)) return '';
    const open = unlocked(i), d = doneStep(i);
    const cls = ['step', d?'done':'', viewStep===i?'current':''].join(' ');
    return `<button type="button" class="${cls}" data-step="${i}" ${open?'':'disabled'} ${viewStep===i?'aria-current="step"':''}>
      <span class="dot">${i===0 && S.pre.skip && !S.pre.done ? '↷' : d?ICON.check:([0,1,2,3,4].filter(j=>j<=i && !HIDE(j)).length)}</span><span class="lbl">${l}</span>${open?'':`<span style="color:var(--lock)">${ICON.lock}</span>`}</button>`;
  }).join('');
  const SI = [0,1,2,3,4].filter(i=>!HIDE(i)), n = SI.filter(doneStep).length;
  $('#progBar').style.width = (n*100/SI.length)+'%';
  $('#progText').textContent = `${n} จาก ${SI.length} ขั้นตอน`;
  $('#resetAll').textContent = ui.confirmReset ? 'กดอีกครั้งเพื่อล้างคำตอบทั้งหมด' : 'เริ่มใหม่ทั้งหมด';
}
$('#steps').addEventListener('click', e=>{
  const b = e.target.closest('[data-step]'); if(!b || b.disabled) return;
  const i = +b.dataset.step;
  go(i===4 && S.post.done ? 'result' : STEP_VIEW[i]);
});
$('#brand').addEventListener('click', ()=>go('home'));
if(PD){ const t = $('#teachSheet'); t.hidden = false; t.addEventListener('click', ()=>go('sheet')); }
$('#nickBar').addEventListener('click', e=>{ if(e.target.closest('[data-nick]')) showNick(true); });
$('#resetAll').addEventListener('click', ()=>{
  if(!ui.confirmReset){ ui.confirmReset = true; renderRail(); setTimeout(()=>{ ui.confirmReset=false; renderRail(); }, 4000); return; }
  ui.confirmReset = false; S = fresh(); save(); ui.q = 0; ui.preSent = false; go('home'); showNick(); toast('ล้างคำตอบแล้ว เริ่มใหม่ได้เลย');
});

/* ---------- router ---------- */
function go(view, opt={}){
  if(view==='pre' && PRE_LOCK()){ toast('เริ่มทำแบบทดสอบหลังเรียนแล้ว ย้อนไปทำก่อนเรียนไม่ได้'); return; }
  if(view==='sheet' && CONF.uni && !RV && !unlocked(3)){ const left = PARTS.map((p,i)=>S.labDone[i] ? '' : p.k).filter(Boolean); toast('ทำภารกิจให้ครบก่อน เหลือ ' + left.join(', ')); if(ui.view==='lab') return; view = 'picker'; }
  if((view==='post' || view==='result') && !RV && !unlocked(4)){ const left = PARTS.map((p,i)=>S.labDone[i] ? '' : p.k).filter(Boolean); toast(left.length ? 'ทำภารกิจให้ครบก่อน เหลือ ' + left.join(', ') : 'ทำขั้นสรุปและทบทวนให้ครบก่อน'); if(ui.view==='lab') return; view = left.length ? 'picker' : 'sheet'; }
  if(ui.view==='lab' && view!=='lab') Lab.stop();
  ui.view = view; Object.assign(ui, opt);
  if(view==='pre' || view==='post'){ const st = S[view]; if(!opt.keepQ){ const f = st.a.findIndex(x=>x===null); ui.q = f<0?0:f; } }
  render(); window.scrollTo({top:0});
}
function render(){
  renderRail();
  const m = $('#main');
  const V = {home:vHome, pre:()=>vQuiz('pre'), post:()=>vQuiz('post'), guide:vGuide, picker:vPicker, lab:vLab, sheet:vSheet, result:vResult}[ui.view] || vHome;
  if(CONF.uni) HELP.def = null;
  m.innerHTML = V();
  if(ui.view==='lab') Lab.mount(ui.part);
  if(ui.view==='lab' && MD){ popWatch(); if(MDC) chipWatch(); }
  if(ui.view==='lab' && CONF.uni && typeof ENDQ!=='undefined'){ setTimeout(eqWatch, 0); eqWatch(); }
  if(ui.view==='lab' && PD){ popWatch(); setTimeout(eqWatch, 0); eqWatch(); const d = $('#pCtrl'); if(d && window.ResizeObserver){ (window.__dro || (window.__dro = new ResizeObserver(()=>dockPad()))).observe(d); } if(ui.dockHide) $('#stage').classList.add('dockhide'); dockPad(); }
}
document.getElementById('main').addEventListener('click', e=>{
  const a = e.target.closest('[data-act]'); if(!a || a.disabled) return;
  const act = a.dataset.act, v = a.dataset.v;
  if(act==='go') go(v);
  if(act==='part') go('lab', {part:+v});
  if(act==='ans'){ const st = S[ui.view], q0 = Math.min(NQ - 1, Math.max(0, ui.q)); ui.q = q0; st.a[q0] = +v; st.a.length = NQ; save(); if(q0<NQ-1) { setTimeout(()=>{ if(ui.q===q0){ ui.q = q0 + 1; render(); } }, 180); } render(); }
  if(act==='q'){ ui.q = +v; render(); }
  if(act==='prev'){ ui.q = Math.max(0, ui.q-1); render(); }
  if(act==='next'){ ui.q = Math.min(NQ-1, ui.q+1); render(); }
  if(act==='submitQuiz') submitQuiz(ui.view);
  if(act==='skipPre'){ S.pre.skip = true; save(); toast('ข้ามแบบทดสอบก่อนเรียนแล้ว กลับมาทำได้ก่อนเริ่มหลังเรียน'); go(NOG ? 'picker' : 'guide'); return; }
  if(act==='guideDone'){ S.guideRead = true; save(); toast('ปลดล็อกห้องแลปแล้ว'); go('picker'); }
  if(act==='pdf') makePdf(a);
  if(act==='cmChip') cmChip(v);
  if(act==='cmSlot') cmSlot(+v);
  if(act==='cmCheck') cmCheck();
  if(act==='rf') rfPick(v);
  if(act==='cardPng') cardPng(a);
  if(act==='lab' && (PD || CONF.uni) && /^eqr?:/.test(String(v))){ const sv = String(v); if(sv.startsWith('eqr:')) eqReason(sv.slice(4)); else eqAnswer(sv.slice(3)); eqFinish(); Lab.refreshUI(); eqRender(); const fb = document.querySelector('.eqb.flash'); if(fb) flashEl(fb); return; }
  if(act==='lab') Lab.action(v, a);
  if(act==='labels'){ ui.noLabels = !ui.noLabels; const l = $('#labels'); if(l) l.hidden = ui.noLabels; a.style.opacity = ui.noLabels ? .45 : 1; a.setAttribute('aria-pressed', String(!ui.noLabels)); }
  if(act==='calc') calcKey(a.dataset.k, a);
  if(act==='calcscr') calcTapScreen(e);
  if(act==='whyclose'){ (ui.whySeen = ui.whySeen || {})[ui.part] = 1; const w = $('#whyModal'); if(w) w.hidden = true; }
  if(act==='guideinfo'){ showInfo('คู่มือการทำกิจกรรม', `<div class="ginfo">${guideSecs()}</div>`); }
  if(act==='full'){ toggleFull(); }
  if(act==='resopen'){ resOpen(true); }
  if(act==='dock'){ ui.dockHide = !ui.dockHide; const st = $('#stage'); if(st) st.classList.toggle('dockhide', ui.dockHide); a.textContent = ui.dockHide ? '▲ ปุ่มควบคุม' : '▼ ซ่อน'; dockPad(); }
  if(act==='infoclose'){ const w = $('#infoModal'); if(w) w.hidden = true; }
  if(act==='whyopen'){ const w = $('#whyModal'); if(w) w.hidden = false; }
  if(act==='help') helpKey(a.dataset.k);
  if(act==='chip') { const [key,val] = v.split('|'); S.sheet[key] = val; save(); render(); }
  if(act==='pred'){ S.pred[ui.part] = a.dataset.o; save(); Lab.refreshUI(); }
});

/* ---------- views ---------- */
function partCards(clickable){
  return `<div class="parts">${PARTS.map((p,i)=>{
    const open = partOpen(i), d = S.labDone[i];
    let pill = d ? `<span class="pill done">${ICON.check} ทำเสร็จแล้ว</span>` : open ? `<span class="pill go">เข้าทำได้ ${ICON.arrow}</span>` :
      `<span class="pill">${ICON.lock} ${!PRE_OK()?'ทำหรือข้ามแบบทดสอบก่อน':'อ่านคู่มือก่อน'}</span>`;

function jRow(row){ let s = '', prev = null;
  row.forEach(n=>{ const isDigit = n.t==='c' && /[0-9.]/.test(n.v), prevDigit = prev && prev.t==='c' && /[0-9.]/.test(prev.v);
    if(prev && VE(prev) && VS(n) && !(isDigit && prevDigit)) s += '*';

function jNode(n){ const R = jRow; switch(n.t){

  case 'k': { const c = CONSTS.find(x=>x[0]===n.v); return '(' + c[1] + ')'; }

    <div class="scr" data-act="calcscr"><div class="ex">${rRow(c.root)}</div><div class="rs">${c.res ? '= ' + esc(c.res) : '&nbsp;'}</div></div>

          <div class="note">คำตอบของฉัน: <b style="color:var(--ink)">${TH[me]}. ${esc(name(me))}</b>${ok?'':` · เฉลย: <b style="color:var(--ok)">${TH[it.a]}. ${esc(name(it.a))}</b>`}</div>
          <div style="font-size:15px;color:var(--ink2)">${esc(it.why)}</div></div>`;
      }).join('')}</div></section>
  </div>`;
}

/* ---------- PDF ---------- */
async function makePdf(btn){
  const el = $('#pdfsheet'), pages = sheetPages();
  const label = btn.innerHTML; btn.disabled = true; btn.textContent = 'กำลังสร้าง PDF...';
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const pdf = new window.jspdf.jsPDF('p','mm','a4');
    for(let k=0;k<pages.length;k++){
      el.innerHTML = pages[k]; fxNode(el); el.style.left = '0px'; el.style.zIndex = '-1';
      let canvas;
      try { canvas = await html2canvas(el.firstElementChild, {scale:2, backgroundColor:'#ffffff', scrollX:0, scrollY:0, windowWidth:1024}); }
      finally { el.style.left = '-12000px'; el.style.zIndex = ''; }
      if(k) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);
    }
    el.innerHTML = '';
    const data = pdf.output('arraybuffer');
    const dl = window.claude ? await window.claude.use('downloads') : window.__fbDL;
    if(!dl){ toast('ดาวน์โหลดไม่ได้ในหน้านี้ ลองเปิดลิงก์ในเบราว์เซอร์'); }
    else {
      try { await dl.save({filename:CONF.file, data}); S.sheetDone = true; save(); renderRail(); toast('ดาวน์โหลดใบกิจกรรมแล้ว นำไปปริ้นได้เลย'); }
      catch(err){ if(err && err.code==='declined') toast('ยกเลิกการดาวน์โหลด'); else if(err && err.code==='rate_limited') toast('รอสักครู่แล้วลองใหม่'); else toast('ดาวน์โหลดไม่สำเร็จ ลองใหม่อีกครั้ง'); }
    }
  }catch(e){ toast('สร้าง PDF ไม่สำเร็จ ลองใหม่อีกครั้ง'); }
  btn.disabled = false; btn.innerHTML = label;
}

  function gas(n, inside){ const arr = []; for(let k=0;k<n;k++){ const m = sph(.022, mat(0xE25555,{emissive:0x7A1010, emissiveIntensity:.3}), 8); const p = inside(true); m.position.copy(p); const d = V(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize(); m.userData.v = d; R.world.add(m); arr.push(m); } return arr; }

  /* ----- constants ----- */

  function clearWorld(){ while(R.world.children.length) R.world.remove(R.world.children[0]); }
  function fitNarrow(){ const el = R.renderer.domElement, a = el.clientWidth/Math.max(1, el.clientHeight); if(a < 1){ const k = Math.min(1.25, .8/a); R.camera.position.sub(R.controls.target).multiplyScalar(k).add(R.controls.target); } }

  /* ===== part 1: heating ice ===== */

  function buildP1(){ const W = R.world;
    P.hot = makeHot('hot', 0, 0); P.labels.push({obj:P.hot, dy:.45, text:()=>`เครื่องให้ความร้อน ${P.s.Pw} W`});

    P.ice = [[-.1,-.08],[.09,-.05],[-.02,.1],[.12,.1]].map(([x,z])=>{ const c = box(.12,.12,.12, TRANS(0xE8F6FF,.85)); c.position.set(x, TABLE_Y + HOT_TOP + .25, z); W.add(c); return c; });
    const th = new THREE.Group(); th.add(cyl(.02,.02,.9, GLASS(.35), 12, true)); P.col = cyl(.011,.011,1, mat(0xE25555), 8); th.add(P.col); th.add(at(sph(.025, mat(0xE25555), 10), 0,-.45,0)); th.position.set(.14, TABLE_Y + HOT_TOP + .5, .1); th.rotation.z = -.15; W.add(th); P.th = th;

  function updP1(){ const s = P.s; if(!P.bk) return; const Q = Qt(s.t), T = Tof(Q), mf = Math.max(0, Math.min(1, (Q - Q1)/Q2)), h = .08 + .8*(T + 15)/120;
    P.col.scale.y = h; P.col.position.y = -.45 + h/2; P.ice.forEach(c=>{ const k = Math.max(.001, 1 - mf); c.scale.setScalar(Math.cbrt(k)); c.visible = mf < .999; });

  function stepP1(dt){ const s = P.s; if(!s.on) return; s.t += dt*s.sp; const end = tC() + 180; if(s.t >= end){ s.t = end; s.on = false; P.say = 'หยุดให้ความร้อนแล้วครับ ใช้ข้อมูลในตารางและกราฟคำนวณได้เลย'; P.dirty = true; }
    while(s.next <= s.t){ s.recs.push([s.next, +Tof(Qt(s.next)).toFixed(1)]); s.next += 30; }
    const ev = (k, t, msg)=>{ if(!s.ev[k] && s.t >= t){ s.ev[k] = Math.round(t); P.say = msg(Math.round(t)); P.dirty = true; } };

  function checkL(v){ const s = P.s, x = num(v); if(s.ev.b===undefined){ P.warn = 'ให้ความร้อนจนน้ำแข็งละลายหมดก่อนครับ'; return; } if(x===null){ P.warn = 'พิมพ์ความร้อนแฝงเป็นตัวเลข หน่วย ×10⁵ J/kg'; return; }

  function checkC(v){ const s = P.s, x = num(v); if(s.ev.c===undefined){ P.warn = 'ให้ความร้อนจนน้ำเดือดก่อนครับ'; return; } if(x===null){ P.warn = 'พิมพ์ความจุความร้อนจำเพาะ หน่วย J/kg·K'; return; }

  const Pv = V => P.s.n*1e-3*8.31*TK/(V*1e-6)/1000, XP = () => XN + P.s.V*KV;
  function buildP2(){ const W = R.world;
    W.add(at(box(2.4,.06,.5, mat(0x5B6280)), .1, TABLE_Y + .03, 0)); [-.4, .7].forEach(x=>{ W.add(at(box(.06, BY2 - TABLE_Y, .06, METAL()), x, (BY2 + TABLE_Y)/2, -.2)); });
    const br = cyl(.22,.22,1.75, GLASS(.22), 32, true); br.rotation.z = Math.PI/2; br.position.set(XN + .875, BY2, 0); W.add(br);
    const nz = cyl(.06,.03,.2, GLASS(.4), 16); nz.rotation.z = Math.PI/2; nz.position.set(XN - .1, BY2, 0); W.add(nz);
    const sc = canvasTex(1024, 64, (x,w,h)=>{ x.fillStyle = '#FFFFFF'; x.fillRect(0,0,w,h); x.fillStyle = '#1C2236'; x.font = '700 26px sans-serif'; x.textAlign = 'center'; for(let v=0;v<=55;v++){ const px = 6 + v*(w - 12)/55, L = v%5 ? 14 : 28; x.fillRect(px - 1.5, 0, 3, L); if(v%10===0) x.fillText(v + (v===50 ? ' mL' : ''), Math.min(w - 40, px), 58); } });

    const pl = new THREE.Group(); pl.userData.id = 'plg'; const pd = cyl(.21,.21,.05, mat(0x2B3050), 28); pd.rotation.z = Math.PI/2; pl.add(pd); const rod = cyl(.03,.03,1.0, mat(0xE8ECF4), 10); rod.rotation.z = Math.PI/2; rod.position.x = .52; pl.add(rod);
    const hd = cyl(.16,.16,.04, mat(0x2B3050), 24); hd.rotation.z = Math.PI/2; hd.position.x = 1.04; pl.add(hd); const hb = hitBox(.4,.5,.5,0); hb.position.x = 1.0; pl.add(hb); W.add(pl); P.pl = pl;
    P.labels.push({obj:hd, dy:.3, text:()=>'ก้านกระบอกฉีดยา (ลากได้)'});
    P.gg = makeGauge(-1.25, BY2 + .35, 0, 500, 'kPa'); W.add(at(cyl(.02,.02,.4, mat(0x2B3050), 8), -1.0, BY2 + .1, 0)); W.children[W.children.length - 1].rotation.z = 1.0;

  }
  function updP2(){ const s = P.s; if(!P.pl) return; P.pl.position.set(XP(), BY2, 0); setGauge(P.gg, Pv(s.V)); }
  function bounce2(m){ const p = m.position, v = m.userData.v, xp = XP() - .04; if(p.x < XN + .03){ p.x = XN + .03; v.x = Math.abs(v.x); } if(p.x > xp){ p.x = xp; v.x = -Math.abs(v.x); } if(Math.abs(p.y - BY2) > .15){ p.y = BY2 + Math.sign(p.y - BY2)*.15; v.y = -v.y; } if(Math.abs(p.z) > .15){ p.z = Math.sign(p.z)*.15; v.z = -v.z; } }

    if(rel(x, t, .03) || rel(x, t*1e-3, .03)){ s.nOk = true; P.say = `ถูกต้องครับ n = PV/RT = (${r.P} × 10³)(${r.V} × 10⁻⁶) ÷ (8.31 × 300) ≈ ${t.toFixed(2)} × 10⁻³ mol`; return; }

  /* ===== part 3: pressure vs temperature ===== */
  const Pt3 = T => P.s.P0*(T + 273.15)/273.15, FY = () => TABLE_Y + HOT_TOP + .36;
  function buildP3(){ const W = R.world, s = P.s;
    P.hot = makeHot('hot', -.2, 0); P.bath = makeBeaker('bath', .45, .8); P.bath.position.set(-.2, TABLE_Y + HOT_TOP, 0); W.add(P.bath); setLevel(P.bath, .85);

    W.add(at(cyl(.025,.025,1.0, mat(0x2B3050), 8), .3, FY() + .78, 0)); W.children[W.children.length - 1].rotation.z = Math.PI/2;
    P.gg = makeGauge(.95, FY() + .78, 0, 200, 'kPa'); P.labels.push({obj:P.gg, dy:.3, text:()=>'เกจวัดความดัน'});
    const th = new THREE.Group(); th.add(cyl(.02,.02,1.0, GLASS(.35), 12, true)); P.col = cyl(.011,.011,1, mat(0xE25555), 8); th.add(P.col); th.position.set(.1, TABLE_Y + HOT_TOP + .55, .25); th.rotation.z = -.2; W.add(th); P.th = th;
    P.labels.push({obj:P.bath, dy:1.05, text:()=>`อ่างน้ำ ${P.s.Tb} °C`});
    P.gas = gas(30, ()=>{ const d = V(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize().multiplyScalar(Math.random()*.18); return V(-.2, FY(), 0).add(d); });
    updP3();
  }
  function updP3(){ const s = P.s; if(!P.bath) return; setGauge(P.gg, Pt3(s.Tb)); const h = .1 + .85*(s.Tb + 10)/120; P.col.scale.y = h; P.col.position.y = -.5 + h/2;
    const c = new THREE.Color(0x8EC5F5).lerp(new THREE.Color(0xF2B07A), s.Tb/100); P.bath.userData.water.material.color.copy(c); setHot(P.hot, s.Tb > 30); }
  function bounce3(m){ const c = V(-.2, FY(), 0), d = m.position.clone().sub(c); if(d.length() > .2){ d.setLength(.2); m.position.copy(c).add(d); const n = d.normalize(); m.userData.v.addScaledVector(n, -2*m.userData.v.dot(n)); } }
  function rec3(){ const s = P.s, p = +Pt3(s.Tb).toFixed(1), first = !s.pt[s.Tb]; s.pt[s.Tb] = {T:s.Tb, P:p}; P.lastT = s.Tb; P.say = `อ่างน้ำ ${s.Tb} °C ความดันแก๊ส ${p.toFixed(1)} kPa${first ? ' บันทึกแล้ว' : ''} สังเกตความเร็วของโมเลกุลด้วยครับ`; }
  function fit3(){ const v = Object.values(P.s.pt); if(v.length < 2) return null; const n = v.length, mx = v.reduce((a,p)=>a + p.T, 0)/n, my = v.reduce((a,p)=>a + p.P, 0)/n; let sxy = 0, sxx = 0; v.forEach(p=>{ sxy += (p.T - mx)*(p.P - my); sxx += (p.T - mx)**2; }); const m = sxy/sxx; return {m, b:my - m*mx, z:-(my - m*mx)/m}; }
  function checkZ(v){ const s = P.s, f = fit3(), x = num(v); if(!f){ P.warn = 'วัดอย่างน้อย 2 อุณหภูมิก่อนครับ'; return; } if(x===null){ P.warn = 'พิมพ์อุณหภูมิเป็นตัวเลข หน่วย °C'; return; }
    if(Math.abs(x - f.z) <= 8){ s.zOk = true; P.say = `ถูกต้องครับ ต่อกราฟไปถึง P = 0 ได้ประมาณ ${f.z.toFixed(0)} °C คือศูนย์สัมบูรณ์ 0 K`; return; }
    s.wrong += 1;

    if(typeof v==='string' && v.startsWith('mg:')){ const id = v.slice(3), g = mgGet(P.i, id), dn = !!(S.miss[P.i] && S.miss[P.i][id]); P.warn = null; P.say = dn ? 'ภารกิจนี้ทำเสร็จแล้วครับ ✓' : (g ? g[1] : null); P.mg = P.say ? {msg:P.say, t:Date.now()} : null; refresh(); if(!dn && !mgFlash(g)){ const nx = (PARTS[P.i].miss.find(x=>!(S.miss[P.i] && S.miss[P.i][x[0]])) || [])[0]; const alt = g && g[3] ? g[3] : (g && nx && nx!==id ? g[1] + ' (ทำข้อที่มี ▶ ทำต่อ ให้เสร็จก่อนนะครับ)' : ''); if(alt){ P.say = alt; P.mg = {msg:alt, t:Date.now()}; refresh(); } } return; }
    if(P) P.mg = null;
    if(typeof v==='string' && v.startsWith('help:')){ const a = v.slice(5), so = SOLS[a], gs = Object.values((typeof GUIDE!=='undefined' && GUIDE[P.i]) || {}), nxm = (PARTS[P.i].miss.find(x=>!(S.miss[P.i] && S.miss[P.i][x[0]])) || [])[0], g = (so && gs.find(x=>x[0]==='#' + so.id)) || mgGet(P.i, nxm); const fm = g ? String(g[1]).replace(/ ?ใส่ช่องคำตอบครับ$/,'').replace(/ ครับ$/,'') + (g[2] && g[2].length ? '<ol style="margin:4px 0 0;padding-left:20px">' + g[2].map(t=>'<li>' + t + '</li>').join('') + '</ol>' : '') : 'ดูขั้นตอนในคำอธิบายของตอนนี้ (ปุ่ม ⓘ)'; const d = so ? autoHelp('ตัวช่วยคำนวณทีละขั้น', fm, so.f()) : null; P.warn = null; if(!d){ P.warn = 'ทำการทดลองให้มีข้อมูลในตารางก่อน แล้วค่อยกด 💡 ครับ'; refresh(); return; } helpOpen(d); return; }
    if(typeof v==='string' && v.startsWith('ev:')){ const s0 = P.s; s0.lk = s0.lk || {}; s0.lk[v.slice(3)] = false; P.warn = null; P.say = 'ดูตัวเลขในตารางผล (กรอบที่กระพริบ) แล้วกลับมาเลือกข้อสรุปใหม่ครับ'; refresh(); setTimeout(()=>flashEl('#pRes'), 80); return; }
    if(!P) return; const s = P.s;
    if(v==='camL') camRotate(-Math.PI/7); else if(v==='camR') camRotate(Math.PI/7);
    else if(v==='zin') camZoom(.82); else if(v==='zout') camZoom(1.2);
    else if(v==='camReset'){ R.camera.position.copy(CAMS[P.i].pos); R.controls.target.copy(CAMS[P.i].tgt); fitNarrow(); }
    else if(v==='resetPart'){ if(S.ps) delete S.ps[P.i]; P = fresh(P.i); build(); }
    else if(v==='go') act(()=>{ if(s.t >= tC() + 180){ P.say = 'การทดลองจบแล้วครับ กด ↺ เริ่มใหม่ได้'; return; } s.on = !s.on; P.say = s.on ? 'เริ่มให้ความร้อนแล้ว ดูกราฟอุณหภูมิในแผงข้างครับ' : 'หยุดชั่วคราวครับ'; });
    else if(v==='sp') act(()=>{ s.sp = s.sp===20 ? 60 : 20; });
    else if(v==='restart') act(()=>{ Object.assign(s, {t:0, on:false, recs:[], next:0, ev:{}}); });
    else if(v==='fast') act(()=>{ s.on = true; for(let k=0;k<2000 && s.on;k++) stepP1(.05); });
    else if(v==='L') act(()=>checkL(val('lv'))); else if(v.startsWith('L:')) act(()=>checkL(v.slice(2)==='auto' ? String(s.Pw*(s.ev.b - s.ev.a)/MI/1e5) : v.slice(2)));
    else if(v==='c') act(()=>checkC(val('cv'))); else if(v.startsWith('c:')) act(()=>checkC(v.slice(2)==='auto' ? String(s.Pw*(s.ev.c - s.ev.b)/(MI*100)) : v.slice(2)));
    else if(v.startsWith('V:')) act(()=>{ s.V = +v.slice(2); updP2(); rec2(); });
    else if(v==='n') act(()=>checkN(val('nv'))); else if(v.startsWith('n:')) act(()=>{ const r = s.pv[P.lastV]; checkN(v.slice(2)==='auto' ? String(r.P*1000*r.V*1e-6/(8.31*TK)*1e3) : v.slice(2)); });
    else if(v.startsWith('T:')) act(()=>{ s.Tb = +v.slice(2); updP3(); rec3(); });
    else if(v==='Tn') act(()=>{ s.Tb = TBS[(TBS.indexOf(s.Tb) + 1) % TBS.length]; updP3(); rec3(); });
    else if(v==='zero') act(()=>checkZ(val('zv').replace('−','-'))); else if(v.startsWith('zero:')) act(()=>checkZ(v.slice(5)==='auto' ? String(fit3().z) : v.slice(5)));
    else if(v.startsWith('ans:')){ const [,q,a] = v.split(':'); answer(q, a); }
  }

  /* ----- pointer ----- */
  let drag = null; const ndc = new THREE.Vector2();
  function pick(e){ const r = R.renderer.domElement.getBoundingClientRect(); ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1); R.raycaster.setFromCamera(ndc, R.camera); }
  function rootOf(o){ while(o && !o.userData.id) o = o.parent; return o; }
  function bindPointer(){
    const el = R.renderer.domElement;
    el.addEventListener('pointerdown', e=>{
      if(!P || drag) return; pick(e);
      const h = R.raycaster.intersectObjects(R.world.children, true).find(x=>rootOf(x.object));
      let g = h ? rootOf(h.object) : null; const lim = Math.max(60, el.clientWidth*.1);
      if(g && g.userData.id==='bk') g = null;
      if(!g){ const o = P.i===1 ? P.pl : P.hot; if(o){ const p = scr(o.getWorldPosition(V(0,0,0)).add(V(P.i===1 ? 1.0 : 0, P.i===1 ? 0 : .15, 0))); if(Math.hypot(p.x - e.clientX, p.y - e.clientY) < lim) g = o; } }
      if(!g || (g.userData.id!=='plg' && g.userData.id!=='hot')) return; const mv = g.userData.id==='plg';
      drag = {id:g.userData.id, x:e.clientX, y:e.clientY, pid:e.pointerId, mv, moved:false};
      if(mv){ e.stopImmediatePropagation(); e.preventDefault(); R.controls.enabled = false; try{ el.setPointerCapture(e.pointerId); }catch(_){} }
    }, {capture:true});
    el.addEventListener('pointermove', e=>{ if(!drag || !drag.mv || e.pointerId!==drag.pid) return; if(!drag.moved && Math.abs(e.clientX-drag.x) + Math.abs(e.clientY-drag.y) > 5) drag.moved = true; if(!drag.moved) return;
      pick(e); const pt = new THREE.Vector3(); if(!R.raycaster.ray.intersectPlane(new THREE.Plane(V(0,0,1), 0), pt)) return; P.s.V = Math.max(8, Math.min(50, Math.round((pt.x - 1.0 - XN)/KV))); updP2(); });
    const end = e=>{ if(!drag || e.pointerId!==drag.pid) return; const d = drag; drag = null; R.controls.enabled = true;
      if(d.mv && d.moved){ act(rec2); return; } if(Math.abs(e.clientX-d.x) + Math.abs(e.clientY-d.y) > 8) return; if(d.id==='hot') action(P.i===0 ? 'go' : 'Tn'); };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  }

  /* ----- loop ----- */
  let last = 0, uiT = 0;
  function tick(t){
    if(!R.active) return;
    requestAnimationFrame(tick);
    const dt = Math.min(.05, (t-last)/1000 || 0); last = t;
    R.controls.update();
    if(P){
      const s = P.s; P.tt += dt;
      if(P.i===0 && P.bk){ stepP1(dt); if(P.steam) runSteam(P.steam, V(0, TABLE_Y + HOT_TOP, 0), s.on && Tof(Qt(s.t)) >= 99.9, dt, .55); }
      else if(P.i===1 && P.gas) runGas(P.gas, .9, dt, bounce2);
      else if(P.i===2 && P.gas) runGas(P.gas, .5*Math.pow((s.Tb + 273)/273, 3), dt, bounce3);
      uiT += dt; if(uiT > .3){ uiT = 0; if(check()) refresh(); else if(!(document.activeElement && document.activeElement.tagName==='INPUT')) refreshUI(); }
      if(P.dirty){ P.dirty = false; refresh(); }
      placeLabels();
    }
    R.renderer.render(R.scene, R.camera);
  }


  /* ----- labels ----- */
  function labelsDOM(){ const box = $('#labels'); if(box) box.innerHTML = P.labels.map((l,k)=>`<div data-l="${k}"></div>`).join(''); }
  const v3 = new THREE.Vector3();
  function placeLabels(){
    const box = $('#labels'); if(!box) return; const w = box.clientWidth, h = box.clientHeight;
    box.querySelectorAll('[data-l]').forEach(el=>{
      const l = P.labels[+el.dataset.l]; if(!l) return; const t = l.text();
      if(!t || !l.obj.visible){ el.hidden = true; return; }
      l.obj.getWorldPosition(v3); v3.y += l.dy; v3.project(R.camera);
      el.style.transform = `translate(${(v3.x*.5+.5)*w}px, ${(-v3.y*.5+.5)*h}px) translate(-50%,-100%)`;
      el.hidden = v3.z > 1; if(el.textContent !== t) el.textContent = t;
    });
  }
  function resize(){ const box = $('#stage'); if(!box || !R) return; const w = box.clientWidth, h = box.clientHeight; if(!w || !h) return; R.renderer.setSize(w, h, false); R.camera.aspect = w/h; { const f0 = R.camera.userData.f0 || (R.camera.userData.f0 = R.camera.fov), a = w/h; R.camera.fov = a < 1.25 ? Math.min(80, 2*Math.atan(Math.tan(f0*Math.PI/360)*1.25/a)*180/Math.PI) : f0; } R.camera.updateProjectionMatrix(); }
  function camRotate(a){ const off = R.camera.position.clone().sub(R.controls.target); off.applyAxisAngle(UP, a); R.camera.position.copy(R.controls.target).add(off); }
  function camZoom(f){ const off = R.camera.position.clone().sub(R.controls.target); off.setLength(Math.max(R.controls.minDistance, Math.min(R.controls.maxDistance, off.length()*f))); R.camera.position.copy(R.controls.target).add(off); }

  return {
    mount(i){
      const box = $('#stage');
      if(!initR()){ box.innerHTML = `<div class="overlay"><div class="card"><h2>เปิดห้องแลป 3 มิติไม่ได้</h2><p class="note" style="margin:0">อุปกรณ์หรือเบราว์เซอร์นี้ไม่รองรับกราฟิก 3 มิติ ลองเปิดด้วย Chrome หรือ Safari รุ่นใหม่ หรือรีเฟรชหน้าอีกครั้ง</p></div></div>`; return; }
      box.prepend(R.renderer.domElement);
      if(!P || P.i!==i){ P = fresh(i); build(); }
      else { P.celebrate = false; P.ctrlSig = ''; labelsDOM(); refreshUI(); }
      if(R.ro) R.ro.disconnect(); R.ro = new ResizeObserver(resize); R.ro.observe(box); resize();
      if(!R.active){ R.active = true; requestAnimationFrame(tick); }
    },
    stop(){ if(R){ R.active = false; if(R.ro) R.ro.disconnect(); } },
    refreshUI(){ if(P){ P.ctrlSig = ''; refreshUI(); } },
    action
  };
})();

/* boot */
render();
showNick();
})();
</script>
